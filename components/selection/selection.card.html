<!-- @dsCard group="Components" viewport="700x300" name="Selection" subtitle="Recognition-first choice tiles, color dots, chips, sub-tabs & category nav" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .lab { font-family: var(--font-rounded); font-size: var(--text-2xs); font-weight: 800;
         letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--ink-soft);
         width: 64px; flex: 0 0 64px; }
  .dot40 { width: 40px; height: 40px; border-radius: 50%; display: block; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Swatch, ColorDot, Chip, SubTab, CategoryTile } = window.DesignMeDesignSystem_157aab;
    const I = (p) => <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{p}</svg>;
    const HairIcon = () => <I><path d="M5 13a7 7 0 0 1 14 0"/><path d="M5 13v4M19 13v4M12 6v3"/></I>;
    const FaceIcon = () => <I><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/><path d="M9 15c1.5 1.2 4.5 1.2 6 0"/></I>;
    const StarIcon = () => <I><path d="M12 3l2.2 5.6L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.8-.4z"/></I>;
    const Garment = ({c}) => <svg width="60" height="52" viewBox="0 0 24 24" fill={c} stroke="rgba(0,0,0,.12)" stroke-width="1"><path d="M8 4 4 7l2 3 2-1v9h8V9l2 1 2-3-4-3-2 2H10Z"/></svg>;
    function Demo() {
      return (
        <div>
          <div className="row">
            <span className="lab">Swatch</span>
            <Swatch label="Hoodie" selected size="lg"><Garment c="#3c3a38" /></Swatch>
            <Swatch label="Knit" size="lg"><Garment c="#c08457" /></Swatch>
            <Swatch label="Tee" size="lg"><Garment c="#e6dcc6" /></Swatch>
          </div>
          <div className="row">
            <span className="lab">Color</span>
            <ColorDot color="linear-gradient(160deg,#f6ddc4,#e0a877 60%,#c98f5f)" label="Tan" selected />
            <ColorDot color="#9a5f37" label="Deep" />
            <ColorDot color="#6f8f6a" label="Sage" />
            <ColorDot color="#bd6f4f" label="Terracotta" />
            <ColorDot color="#5a6f8c" label="Denim" />
          </div>
          <div className="row">
            <span className="lab">Chip</span>
            <Chip selected>All</Chip>
            <Chip>Everyday</Chip>
            <Chip>Soft</Chip>
            <Chip>Streetwear</Chip>
          </div>
          <div className="row">
            <span className="lab">Sub-tab</span>
            <SubTab selected>Eyes</SubTab>
            <SubTab>Nose</SubTab>
            <SubTab>Lips</SubTab>
          </div>
          <div className="row">
            <span className="lab">Category</span>
            <CategoryTile icon={<StarIcon />} label="Vibe" selected />
            <CategoryTile icon={<HairIcon />} label="Hair" />
            <CategoryTile icon={<FaceIcon />} label="Face" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
