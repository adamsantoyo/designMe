<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>designMe engine QA — every catalog item</title>
<style>
  body { margin:0; padding:20px 24px 60px; background:#ece7dc; color:#2f2823;
         font:14px/1.4 "Nunito", system-ui, sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; }
  p { color:#6b5f53; margin:0 0 14px; font-size:13px; }
  h2 { font-size:15px; margin:22px 0 8px; text-transform:capitalize; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { width:118px; background:#fbf8f2; border:1px solid #ddd0bd; border-radius:12px;
          padding:6px 4px 4px; text-align:center; }
  .cell .fig { height:150px; display:flex; align-items:flex-end; justify-content:center; }
  .cell .fig svg { height:100%; width:auto; }
  .cell .cap { font-size:10.5px; font-weight:800; color:#6b5f53; padding-top:3px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<h1>Engine QA — every catalog item, rendered</h1>
<p>Same case list as <code>tools/engine-smoke.mjs</code>. Filter: <code>?cat=hair</code> etc.</p>
<div id="out"></div>
<script type="module">
  import dmFigure from "../app/src/engine/dmFigure.js";
  import { cases, base } from "./engine-cases.mjs";

  const filter = new URLSearchParams(location.search).get("cat");
  const out = document.getElementById("out");
  let currentCat = null, grid = null;
  for (const [cat, id, patch] of cases) {
    if (filter && cat !== filter) continue;
    if (cat !== currentCat) {
      currentCat = cat;
      const h = document.createElement("h2");
      h.textContent = cat;
      out.appendChild(h);
      grid = document.createElement("div");
      grid.className = "grid";
      out.appendChild(grid);
    }
    const cell = document.createElement("div");
    cell.className = "cell";
    const fig = document.createElement("div");
    fig.className = "fig";
    try {
      fig.innerHTML = dmFigure({ ...base(), ...patch });
    } catch (e) {
      fig.textContent = "ERR " + e.message;
    }
    cell.appendChild(fig);
    cell.insertAdjacentHTML("beforeend", `<div class="cap">${id}</div>`);
    grid.appendChild(cell);
  }
</script>
</body>
</html>
