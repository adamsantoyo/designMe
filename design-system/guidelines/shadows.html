<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Soft, warm-brown elevation — sm → xl" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-rounded); }
  .row { display: flex; gap: 26px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 110px; height: 72px; background: var(--surface); border-radius: var(--radius-lg); }
  .nm { font-size: var(--text-xs); font-weight: 800; color: var(--ink); }
  .vr { font-size: var(--text-2xs); font-weight: 700; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><span class="box" style="box-shadow:var(--shadow-md)"></span><span class="nm">md</span><span class="vr">resting card</span></div>
    <div class="cell"><span class="box" style="box-shadow:var(--shadow-sm)"></span><span class="nm">sm</span><span class="vr">floating chip</span></div>
    <div class="cell"><span class="box" style="box-shadow:var(--shadow-lg)"></span><span class="nm">lg</span><span class="vr">avatar card</span></div>
    <div class="cell"><span class="box" style="box-shadow:var(--shadow-xl)"></span><span class="nm">xl</span><span class="vr">sheet / dialog</span></div>
  </div>
</body>
</html>
