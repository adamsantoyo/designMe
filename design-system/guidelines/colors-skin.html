<!-- @dsCard group="Colors" viewport="700x130" name="Skin tones" subtitle="Representation is a core requirement — a wide range, never a light default" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--bg); font-family: var(--font-rounded); }
  .row { display: flex; gap: 8px; }
  .dot { flex: 1; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.7);
         box-shadow: var(--shadow-sm), inset 0 -4px 8px rgba(0,0,0,.12); }
  .cap { margin-top: 10px; font-size: var(--text-sm); font-weight: 700; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="row">
    <span class="dot" style="background:linear-gradient(160deg,#fbe7d2,#f4d4ba 60%,#e6bfa0)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#f5d7bb,#ecbf9c 60%,#dcaa83)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#ecc49a,#e0a877 60%,#cd9362)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#daab7d,#cf9460 60%,#bb8050)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#c79468,#b87a48 60%,#a3683b)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#aa7650,#9a5f37 60%,#84502d)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#8c5d3d,#7c4a2b 60%,#673c22)"></span>
    <span class="dot" style="background:linear-gradient(160deg,#6f452c,#5e3720 60%,#4a2c19)"></span>
  </div>
  <div class="cap">A continuous range, presented as ordinary choices — plus skin features (vitiligo, freckles, scars) as everyday options.</div>
</body>
</html>
