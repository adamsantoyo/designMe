<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-serif); color: var(--ink); }
  .big { font-size: 38px; font-weight: 500; line-height: 1.1; }
  .big i { font-style: italic; }
  .sub { font-family: var(--font-rounded); font-size: var(--text-sm); color: var(--ink-soft); margin-top: 12px; max-width: 520px; }
</style>
</head>
<body>
  <div class="big">Your <i>lookbook</i>, a small gallery</div>
  <p class="sub">Used sparingly as the pride-spark — the wordmark and the occasional editorial / gallery headline. Expressive italics carry the warmth; body copy always stays in the rounded sans.</p>
</body>
</html>
