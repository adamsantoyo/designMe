<!-- @dsCard group="Brand" viewport="700x180" name="North star" subtitle="Recognition over recall — show, don't tell" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-rounded); }
  .q { font-family: var(--font-serif); font-size: 23px; font-weight: 500; line-height: 1.35; color: var(--ink); margin: 0 0 16px; max-width: 640px; }
  .q i { font-style: italic; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: var(--text-xs); font-weight: 800; color: var(--sage-deep); background: var(--sage-wash);
          border: 1px solid var(--sage); border-radius: var(--radius-pill); padding: 6px 12px; }
</style>
</head>
<body>
  <p class="q">A tool for self-expression for someone who may not be able to <i>tell</i> you what they like — but can <i>show</i> you.</p>
  <div class="row">
    <span class="pill">More independence</span>
    <span class="pill">More dignity</span>
    <span class="pill">Less pressure</span>
    <span class="pill">No typing</span>
    <span class="pill">Never told you're wrong</span>
  </div>
</body>
</html>
