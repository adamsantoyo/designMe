<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg); display: flex; align-items: center; gap: 28px; }
  .mark { font-family: var(--font-serif); font-size: 54px; font-weight: 500; color: var(--ink); letter-spacing: .2px; }
  .mark b { font-weight: 600; font-style: italic; }
  .tag { font-family: var(--font-rounded); font-size: var(--text-sm); font-weight: 700;
         letter-spacing: var(--tracking-wide); color: var(--ink-soft); }
  .note { font-family: var(--font-rounded); font-size: var(--text-sm); color: var(--ink-soft); max-width: 260px; }
  .note b { color: var(--ink); }
</style>
</head>
<body>
  <div>
    <div class="mark">design<b>Me</b></div>
    <div class="tag">Find Your Vibe</div>
  </div>
  <p class="note">The wordmark sets <b>designMe</b> in the rounded UI sans with the <b>“Me”</b> in italic serif — the small editorial “pride-spark” that signals taste, not diagnosis.</p>
</body>
</html>
