<!-- @dsCard group="Colors" viewport="700x150" name="Brand accents" subtitle="Sage primary, terracotta action & earthy supports" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--bg); font-family: var(--font-rounded); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); padding: 10px; height: 104px;
        display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
  .nm { font-size: var(--text-sm); font-weight: 800; }
  .vr { font-size: var(--text-2xs); font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--sage)"><span class="nm">Sage</span><span class="vr">--sage #6f8f6a</span></div>
    <div class="sw" style="background:var(--sage-deep)"><span class="nm">Sage deep</span><span class="vr">--sage-deep #3f5c3b</span></div>
    <div class="sw" style="background:var(--terra)"><span class="nm">Terra</span><span class="vr">--terra #bd7a4f</span></div>
    <div class="sw" style="background:var(--terra-deep)"><span class="nm">Terra deep</span><span class="vr">--terra-deep #8a5430</span></div>
    <div class="sw" style="background:var(--wood)"><span class="nm">Wood</span><span class="vr">--wood #a9764f</span></div>
    <div class="sw" style="background:var(--sky)"><span class="nm">Sky</span><span class="vr">--sky #6f8a9b</span></div>
    <div class="sw" style="background:var(--stone)"><span class="nm" style="color:var(--ink)">Stone</span><span class="vr" style="color:var(--ink)">--stone #cdbfb0</span></div>
  </div>
</body>
</html>
