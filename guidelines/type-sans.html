<!-- @dsCard group="Type" viewport="700x230" name="Rounded sans scale" subtitle="Nunito ≈ SF Pro Rounded — all UI & body" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-rounded); color: var(--ink); }
  .r { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .r:last-child { border: 0; }
  .meta { width: 150px; flex: 0 0 150px; font-size: var(--text-2xs); font-weight: 800; color: var(--ink-soft);
          letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .spec { line-height: 1.1; }
</style>
</head>
<body>
  <div class="r"><span class="meta">Display · 900</span><span class="spec" style="font-size:var(--text-2xl);font-weight:900">Make a you</span></div>
  <div class="r"><span class="meta">Section · 800</span><span class="spec" style="font-size:var(--text-xl);font-weight:800">Pick a vibe</span></div>
  <div class="r"><span class="meta">Title · 800</span><span class="spec" style="font-size:var(--text-lg);font-weight:800">Tap to try it on</span></div>
  <div class="r"><span class="meta">Body · 400</span><span class="spec" style="font-size:var(--text-base)">Every choice is visual — no typing required.</span></div>
  <div class="r"><span class="meta">Label · 700</span><span class="spec" style="font-size:var(--text-md);font-weight:700">Hair color</span></div>
  <div class="r"><span class="meta">Caption · 700</span><span class="spec" style="font-size:var(--text-xs);font-weight:700;color:var(--ink-soft)">hoodie, barrel denim, sneakers</span></div>
</body>
</html>
