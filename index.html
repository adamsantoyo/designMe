/* ---- focus retention across re-renders ----
   Panels and the category bar are rebuilt via innerHTML, which destroys the
   control the user just activated and drops focus to <body>. That strands
   keyboard and switch-scanning users on every single choice. We capture the
   active control by its stable data-* attributes before a rebuild and restore
   focus to its replacement afterwards. */
const FOCUS_ATTRS = ['data-action','data-cat','data-key','data-val','data-tab','data-filter','data-idx'];
function rememberFocus(){
  const el = document.activeElement;
  if(!el || el === document.body || typeof el.getAttribute !== 'function') return null;
  const sel = FOCUS_ATTRS.filter(n=>el.hasAttribute(n))
    .map(n=>`[${n}="${(el.getAttribute(n)||'').replace(/"/g,'\\"')}"]`).join('');
  return sel || null;
}
function restoreFocus(sel){
  if(!sel) return;
  const el = document.querySelector(sel);
  if(el && typeof el.focus === 'function') el.focus();
}

/* ---- announce changes for screen readers (polite) ---- */
function announce(msg){ liveEl.textContent = ''; liveEl.textContent = msg; }

/* ---- render the pinned avatar ---- */
function paintAvatar(){
  const vb = window.innerWidth < 860 ? '40 0 240 400' : `0 0 ${VIEW.w} ${VIEW.h}`;
  mount.innerHTML = renderAvatar(App.state, { title: avatarDescription(), alive: true, viewBox: vb });
}
function avatarDescription(){
  const s = App.state;
  const parts = [
    byId(CAT.skin,s.skin).label+' skin',
    (s.hair==='bald'?'bald':byId(CAT.hair,s.hair).label+' hair'),
    'wearing a '+byId(CAT.top,s.top).label.toLowerCase(),
  ];
  if(s.makeup!=='none') parts.push(byId(CAT.makeup,s.makeup).label.toLowerCase()+' makeup');
  parts.push(byId(CAT.shoe,s.shoe).label.toLowerCase());
  if(s.carry!=='none') parts.push(byId(CAT.carry,s.carry).label.toLowerCase());
  if(s.glasses!=='none') parts.push('glasses');
  if(s.mobility==='wheelchair') parts.push('using a wheelchair');
  if(s.aac!=='none'){
    const aacName = byId(CAT.aac, s.aac).label;
    parts.push('holding ' + (/^[aeiou]/i.test(aacName) ? 'an ' : 'a ') + aacName.toLowerCase());
  }
  return 'Your avatar: '+parts.join(', ')+'.';
}

/* ---- change state (records history, repaints) ---- */
function setKey(key, val, label){
  App.history.push(Object.assign({}, App.state));

  if(label) announce(label);
}

/* ---- swatch builders ---- */
function swatch(action, key, val, selected, label, inner, extra){
  return `<button class="swatch" data-action="${action}" data-key="${key}" data-val="${val}" ${extra||''}
            aria-pressed="${selected}" aria-label="${label}">

}
function miniHead(stateOverride){

function miniBody(stateOverride, crop){

  else if(crop === 'bottom') vb = '50 260 220 280';

  const tabBar = tabs.map(([k,l])=>`<button class="subtab" data-action="outfittab" data-tab="${k}" aria-pressed="${App.outfitTab===k}">${l}</button>`).join('');

  if(App.outfitTab==='tops'){
    const tops = CAT.top.map(o=> swatch('set','top',o.id, App.state.top===o.id, o.label, miniBody({top:o.id}, 'top')) ).join('');
    const topsColors = CAT.garmentColor.map(o=> swatch('set','topColor',o.v, App.state.topColor===o.v, o.label, `<span class="dot" style="background:${o.v}"></span>`) ).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Top</h3><div class="grid big">${tops}</div></div>
            <div class="group"><h3>Color</h3><div class="grid colors">${topsColors}</div></div>`;
  }
  if(App.outfitTab==='bottoms'){
    const bottoms = CAT.bottom.map(o=> swatch('set','bottom',o.id, App.state.bottom===o.id, o.label, miniBody({bottom:o.id}, 'bottom')) ).join('');
    const botsColors = CAT.garmentColor.map(o=> swatch('set','bottomColor',o.v, App.state.bottomColor===o.v, o.label, `<span class="dot" style="background:${o.v}"></span>`) ).join('');
    const tex = CAT.texture.map(o=>{
      const inner = `<span class="dot" style="position:relative; overflow:hidden;"><svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="#cdbfb0"/><rect width="40" height="40" fill="url(#${o.pat})"/></svg></span>`;
      return swatch('set','texture',o.id, App.state.texture===o.id, o.label, inner);
    }).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Bottoms</h3><div class="grid big">${bottoms}</div></div>
            <div class="group"><h3>Color</h3><div class="grid colors">${botsColors}</div></div>
            <div class="group"><h3>Feel / texture</h3><div class="grid">${tex}</div></div>`;
  }
  // shoes & carry tab
  const shoes = CAT.shoe.map(o=> swatch('set','shoe',o.id, App.state.shoe===o.id, o.label, miniBody({shoe:o.id}, 'shoe')) ).join('');
  const carry = CAT.carry.map(o=> swatch('set','carry',o.id, App.state.carry===o.id, o.label, miniBody({carry:o.id}, 'carry')) ).join('');
  return `<div class="subtabs" role="tablist">${tabBar}</div>
          <div class="group"><h3>Shoes</h3><div class="grid big">${shoes}</div></div>
          <div class="group"><h3>Carry</h3><div class="grid big">${carry}</div></div>`;
}

function panelColor(){
  const pals = CAT.palette.map(o=>{
    const inner = `<span style="display:flex;gap:4px"><span class="dot" style="width:22px;height:38px;border-radius:8px;background:${o.top}"></span><span class="dot" style="width:22px;height:38px;border-radius:8px;background:${o.bottom}"></span></span>`;
    const sel = App.state.topColor===o.top && App.state.bottomColor===o.bottom;
    return swatch('palette','palette',o.id, sel, o.label, inner);
  }).join('');
  return `<div class="group"><h3>Coordinated palettes</h3><div class="grid big">${pals}</div></div>`;
}

function panelVibe(){
  const filters = CAT.vibeFilters.map(f=>`<button class="vibeFilter" data-action="vibefilter" data-filter="${f.id}" aria-pressed="${App.vibeFilter===f.id}">${f.label}</button>`).join('');
  const list = App.vibeFilter==='all' ? CAT.vibe : CAT.vibe.filter(o => o.moods.includes(App.vibeFilter));
  const v = list.map(o=>{
    const preview = Object.assign({}, App.state, vibePreviewIdentity(o), o.set);
    const inner = renderAvatar(preview, { viewBox:'40 20 240 460', class:'mini' });
    const top = byId(CAT.top, o.set.top).label;
    const bottom = byId(CAT.bottom, o.set.bottom).label;
    const selected = App.state.top===o.set.top && App.state.bottom===o.set.bottom && App.state.topColor===o.set.topColor && App.state.bottomColor===o.set.bottomColor;
    const vibeTop = mix(o.set.topColor, '#ffffff', .42);
    const vibeBottom = mix(o.set.bottomColor, '#ffffff', .68);
    return `<button class="vibeCard" data-action="vibe" data-key="vibe" data-val="${o.id}" aria-pressed="${selected}" aria-label="${o.label} vibe" style="--vibeTop:${vibeTop};--vibeBottom:${vibeBottom};">
      <span class="vibePreview">${inner}</span>
      <span class="vibeMeta">
        <span class="vibeTag">${o.tag}</span>
        <span class="vibeName">${o.label}</span>
        <span class="vibeChips"><i style="background:${o.set.topColor}"></i><i style="background:${o.set.bottomColor}"></i><span class="vibeHint">${top} + ${bottom}</span></span>
        <span class="vibeNote">${o.note}</span>
      </span>
    </button>`;
  }).join('');
  const hero = `<button class="discoverHero" data-action="discover-start" aria-label="Find my vibe \u2014 tap looks you like, no typing needed">
      <span class="dhIcon" aria-hidden="true">\u2728</span>
      <span class="dhText"><span class="dhTitle">Find my vibe</span><span class="dhSub">Tap looks you like \u2014 we'll build it for you</span></span>
      <span class="dhGo" aria-hidden="true">\u2192</span>
    </button>`;
  return `<div class="group">${hero}</div>
          <div class="group"><h3>Tap a style world</h3><div class="vibeFilters" role="tablist" aria-label="Vibe filters">${filters}</div><div class="vibeGrid">${v}</div></div>`;
}

/* ---- toolbar (Back/Undo enabled state) ---- */
function updateToolbar(){
  $('#undoBtn').disabled = App.history.length === 0;
  $('#backBtn').disabled = App.panelHistory.length === 0;
}

/* ---- lookbook ---- */
function renderLooks(){
  if(App.looks.length===0){ looksEl.innerHTML = `<div class="empty">No saved looks yet — tap “Save look”.</div>`; return; }
  looksEl.innerHTML = App.looks.map((s,i)=>`
    <button class="look" data-action="restore" data-idx="${i}" aria-label="Saved look ${i+1} — tap to wear again">
      ${renderAvatar(s, { viewBox:'0 0 320 540', class:'mini' })}
    </button>`).join('');
}

/* ---- save micro-confirmation ---- */
function saveLook(){
  App.looks.unshift(Object.assign({}, App.state));
  if(App.looks.length>24) App.looks.pop();
  lsSave(LS_LOOKS, App.looks);
  renderLooks();
  // gentle confirmation (reduced-motion safe via CSS)
  avatarCard.classList.remove('saved'); void avatarCard.offsetWidth; avatarCard.classList.add('saved');
  toast.classList.add('show');
  clearTimeout(saveLook._t);
  saveLook._t = setTimeout(()=> toast.classList.remove('show'), 1600);
  announce('Look saved to your lookbook.');
}

/* ---- navigation ---- */
function gotoCat(id){
  if(id===App.activeCat) return;
  App.panelHistory.push(App.activeCat);
  App.activeCat = id;
  renderCats(); renderPanel(); updateToolbar();
}
function goBack(){
  if(App.panelHistory.length===0) return;
  App.activeCat = App.panelHistory.pop();
  renderCats(); renderPanel(); updateToolbar();
}
function undo(){
  if(App.history.length===0) return;
  App.state = App.history.pop();
  paintAvatar(); renderPanel(); updateToolbar();
  announce('Undid last change.');
}
function shuffle(){
  App.history.push(Object.assign({}, App.state));
  App.state = fixColors(randomState());
  paintAvatar(); renderPanel(); updateToolbar();
  announce('Shuffled a fresh avatar.');
}

/* ---- event delegation ---- */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  if(a==='cat') gotoCat(t.dataset.cat);
  else if(a==='facetab'){ App.faceTab = t.dataset.tab; renderPanel(); }
  else if(a==='outfittab'){ App.outfitTab = t.dataset.tab; renderPanel(); }
  else if(a==='vibefilter'){ App.vibeFilter = t.dataset.filter; renderPanel(); }
  else if(a==='set'){
    const key = t.dataset.key; let val = t.dataset.val;
    const labelText = t.getAttribute('aria-label');
    setKey(key, val, labelText+' selected');
  }
  else if(a==='palette'){
    const o = byId(CAT.palette, t.dataset.val);
    setMany({ topColor:o.top, bottomColor:o.bottom }, o.label+' palette selected');
  }
  else if(a==='vibe'){
    const o = byId(CAT.vibe, t.dataset.val);
    setMany(Object.assign({}, o.set), o.label+' vibe selected');
  }
  else if(a==='discover-start') startDiscover();
  else if(a==='discover-pick') chooseDiscover(t.dataset.pick);
  else if(a==='discover-skip') skipDiscover();
  else if(a==='discover-finish') finishDiscover();
  else if(a==='discover-exit') exitDiscover();
  else if(a==='back') goBack();
  else if(a==='undo') undo();
  else if(a==='shuffle') shuffle();
  else if(a==='save') saveLook();
  else if(a==='restore'){ 
    App.history.push(Object.assign({}, App.state));
    App.state = Object.assign({}, App.looks[+t.dataset.idx]);
    paintAvatar(); renderPanel(); updateToolbar(); announce('Wearing a saved look.');
  }
  else if(a==='inspire'){ announce('Inspiration helper is coming later.'); }
});

/* keyboard: in the discovery overlay, arrows choose left/right and Escape closes */
document.addEventListener('keydown', (e)=>{
  if(!Discover.active) return;
  if(e.key==='Escape'){ exitDiscover(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); chooseDiscover('a'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); chooseDiscover('b'); }
});

/* keyboard: arrow nav within a grid is handled natively by Tab; Enter/Space by buttons */

/* ============================================================================
   STARTUP + dev self-checks (counts / determinism)
   ============================================================================ */
function init(){
  // Restore persisted state — falls back to defaults if nothing saved yet
  const savedState = lsLoad(LS_STATE);
  if(savedState) App.state = fixColors(Object.assign(fixColors(latinoFirstState()), savedState));
  const savedLooks = lsLoad(LS_LOOKS);
  if(savedLooks && Array.isArray(savedLooks)) App.looks = savedLooks.slice(0, 24);
  renderCats();
  paintAvatar();
  renderPanel();
  renderLooks();
  updateToolbar();
  window.addEventListener('resize', ()=>{ clearTimeout(paintAvatar._rt); paintAvatar._rt = setTimeout(paintAvatar, 150); });
  devChecks();
}

function devChecks(){
  const need = { skin:14, hair:8, brow:5, eye:5, nose:5, lip:5, faceShape:5, body:4 };
  const report = {};
  Object.keys(need).forEach(k=>{ report[k] = CAT[k].length + ' (need ≥' + need[k] + ')'; console.assert(CAT[k].length>=need[k], 'Catalog short on '+k); });
  const textures = new Set(CAT.hair.map(h=>h.texture)); 
  // determinism: same state -> identical markup
  const s = App.state;
  const a = renderAvatar(s), b = renderAvatar(s);
  const stripIds = (str)=> str.replace(/a\d+_/g,'P');
  console.assert(stripIds(a)===stripIds(b), 'Avatar render is not deterministic!');
  const assistive = (CAT.glasses.length-1) + (CAT.mobility.length-1) + (CAT.aac.length-1);
  console.log('%cdesignMe self-check', 'font-weight:bold');
  console.table(report);
  console.log('hair textures:', [...textures].filter(x=>x!=='none').length, '| assistive options:', assistive, '| determinism: OK');
}

document.addEventListener('DOMContentLoaded', init);
</script>
