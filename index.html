    v_athleisure: { group:'Active', tags:['vibe','active','track'], status:'needs-redesign', flatAssetStatus:'needs-svg', priority:'P0', promptNotes:'Bomber, track pant, runner.', svgNotes:'Depends on trackPant renderer cleanup.' },
    v_trail:      { group:'Active', tags:['vibe','trail','utility'], priority:'P0', promptNotes:'Trail jacket, cargo, runners.', svgNotes:'Uses existing pieces.' },
    v_studiomove: { group:'Active', tags:['vibe','movement','studio'], status:'needs-redesign', flatAssetStatus:'needs-svg', priority:'P1', promptNotes:'Mesh layer and track pant.', svgNotes:'Depends on trackPant renderer cleanup.' },
    v_satin:      { group:'Night', tags:['vibe','satin','evening'], priority:'P1', promptNotes:'Slip dress, trouser, warm glam.', svgNotes:'Uses existing pieces.' },
    v_downtown:   { group:'Night', tags:['vibe','downtown','boots'], priority:'P1', promptNotes:'Corset, dark denim, boots.', svgNotes:'Uses existing pieces.' },
    v_metallic:   { group:'Creative', tags:['vibe','concert','night','creative'], status:'rename', priority:'P1', promptNotes:'Shine top, dark trouser, boots.', svgNotes:'Rename only.' },
  },
};

function applyCatalogMetadata(){
  Object.keys(CAT).forEach(category => {
    const arr = CAT[category];
    if(!Array.isArray(arr)) return;
    const categoryMeta = CAT_CATEGORY_META[category] || {};
    arr.forEach(item => {
      const itemMeta = (CAT_ITEM_META[category] && CAT_ITEM_META[category][item.id]) || {};
      const meta = Object.assign({}, CAT_META_DEFAULTS, categoryMeta, itemMeta, { category });
      meta.tags = (meta.tags || []).slice();
      Object.assign(item, meta);
    });
  });
}
applyCatalogMetadata();

/* index helpers */
function byId(arr, id){ return arr.find(o=>o.id===id) || arr[0]; }

/* ============================================================================
   LAYER 2 — RENDER ENGINE
   geometry() resolves all coordinates from state (parametric body + height).
   avatarMarkup() composes z-ordered SVG layers; only requested `parts` render
   (used to keep mini-previews light). renderAvatar() wraps it in an <svg>.
   ============================================================================ */

const VIEW = { w: 320, h: 540 };

function geometry(state){
  const cx = 160;
  const bm = byId(CAT.body, state.body).m;
  const fs = byId(CAT.faceShape, state.faceShape).m;
  const seated = state.mobility === 'wheelchair';
  const hStep = CAT.height.findIndex(h=>h.id===state.height);
  const hs = hStep < 0 ? 2 : hStep;

  const headCY = 96;
  const headTopY = headCY - fs.ry;
  const chinY = headCY + fs.ry * (0.72 + fs.chin*0.5);

  const neckTopY = chinY - 6;
  const shoulderY = 190;
  const torsoLen = 150 + hs*6;
  const chestY = shoulderY + torsoLen*0.30;
  const waistY = shoulderY + torsoLen*0.64;
  const hipY   = shoulderY + torsoLen;
  const crotchY= hipY + 12;

  const legLen = seated ? 70 : (148 + hs*15);
  const kneeY  = crotchY + legLen*0.48;
  const ankleY = crotchY + legLen;
  const footY  = ankleY + 14;

  return {
    cx, seated, hs, fs, bm,
    headCY, headTopY, chinY, headRX: fs.cheek, headRY: fs.ry,
    neckTopY, shoulderY, chestY, waistY, hipY, crotchY,
    kneeY, ankleY, footY, legLen,
    // facial feature anchors (relative to head)
    eyeY: headCY + 8,
    eyeDX: 19,
    browY: headCY - 7,
    noseY: headCY + 24,
    mouthY: headCY + 42,
  };
}

/* ---- gradient + filter defs for one avatar instance ---- */
function defsFor(P, state){
  const skin = byId(CAT.skin, state.skin).base;
  const hair = byId(CAT.hairColor, state.hairColor).v;
  const topC = state.topColor;
  const botC = state.bottomColor;
  let d = '';
  const vGrad = (id, c, topAdj, botAdj) =>
    `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0" stop-color="${shade(c, topAdj)}"/>
       <stop offset="1" stop-color="${shade(c, botAdj)}"/>
     </linearGradient>`;
  d += vGrad(P+'skin', skin, 0.10, -0.10);
  d += `<radialGradient id="${P}cheek" cx="0.5" cy="0.42" r="0.6">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>`;
  d += vGrad(P+'hair', hair, 0.18, -0.16);
  if(topC) d += vGrad(P+'top', topC, 0.12, -0.14);
  if(botC) d += vGrad(P+'bot', botC, 0.10, -0.16);
  if(state.aura && state.aura !== 'none') {
    const aura = byId(CAT.aura, state.aura);
    if(aura && aura.c){
      d += `<radialGradient id="${P}aura" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="${aura.c}" stop-opacity="1"/>
              <stop offset="0.7" stop-color="${aura.c}" stop-opacity="0.3"/>
              <stop offset="1" stop-color="${aura.c}" stop-opacity="0"/>
            </radialGradient>`;
    }
  }
  return `<defs>${d}</defs>`;
}

/* ---- limb helper: rounded "stadium" capsule between two points ---- */
function limb(x1,y1,x2,y2,r){
  const a = Math.atan2(y2-y1, x2-x1);
  const nx = Math.cos(a + Math.PI/2)*r, ny = Math.sin(a + Math.PI/2)*r;
  return `M ${R(x1+nx)} ${R(y1+ny)} L ${R(x2+nx)} ${R(y2+ny)} `+
         `A ${r} ${r} 0 0 1 ${R(x2-nx)} ${R(y2-ny)} L ${R(x1-nx)} ${R(y1-ny)} `+
         `A ${r} ${r} 0 0 1 ${R(x1+nx)} ${R(y1+ny)} Z`;
}

/* ---- head outline path from face-shape metrics ---- */
function headPath(g){
  const {cx, headCY:cy} = g; const m = g.fs;
  const ry = m.ry, top = m.top, cheek = m.cheek, jaw = m.jaw;
  const chinY = cy + ry*(0.72 + m.chin*0.5);
  return `M ${cx} ${R(cy-ry)}
    C ${R(cx-top)} ${R(cy-ry)}, ${R(cx-cheek)} ${R(cy-ry*0.45)}, ${R(cx-cheek)} ${R(cy-ry*0.02)}
    C ${R(cx-cheek)} ${R(cy+ry*0.34)}, ${R(cx-jaw)} ${R(cy+ry*0.5)}, ${R(cx-jaw*0.6)} ${R(chinY-6)}
    Q ${cx} ${R(chinY)} ${R(cx+jaw*0.6)} ${R(chinY-6)}
    C ${R(cx+jaw)} ${R(cy+ry*0.5)}, ${R(cx+cheek)} ${R(cy+ry*0.34)}, ${R(cx+cheek)} ${R(cy-ry*0.02)}
    C ${R(cx+cheek)} ${R(cy-ry*0.45)}, ${R(cx+top)} ${R(cy-ry)}, ${cx} ${R(cy-ry)} Z`;
}

/* ============================  PART BUILDERS  ============================ */

function buildBody(g, state, P){
  const {cx, shoulderY, chestY, waistY, hipY, crotchY} = g;
  const m = g.bm;
  const sh=m.sh, ch=m.ch, wa=m.wa, hp=m.hp;
  const stroke = `stroke="url(${''})"`; // placeholder (unused)
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.22);
  const torso = `M ${R(cx-sh)} ${R(shoulderY)}
    C ${R(cx-ch)} ${R(chestY-4)}, ${R(cx-wa-2)} ${R(waistY-12)}, ${R(cx-wa)} ${R(waistY)}
    C ${R(cx-wa-1)} ${R(waistY+10)}, ${R(cx-hp)} ${R(hipY-10)}, ${R(cx-hp)} ${R(hipY)}
    L ${R(cx-hp+3)} ${R(crotchY)} L ${R(cx+hp-3)} ${R(crotchY)} L ${R(cx+hp)} ${R(hipY)}
    C ${R(cx+hp)} ${R(hipY-10)}, ${R(cx+wa+1)} ${R(waistY+10)}, ${R(cx+wa)} ${R(waistY)}
    C ${R(cx+wa+2)} ${R(waistY-12)}, ${R(cx+ch)} ${R(chestY-4)}, ${R(cx+sh)} ${R(shoulderY)}
    C ${R(cx+sh*0.5)} ${R(shoulderY-7)}, ${R(cx-sh*0.5)} ${R(shoulderY-7)}, ${R(cx-sh)} ${R(shoulderY)} Z`;
  return `<path d="${torso}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`;
}

function buildArms(g, state, P){
  const {cx, shoulderY, hipY} = g; const m=g.bm;
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.22);
  const r = m.arm;
  const topX = cx + m.sh*0.86, topY = shoulderY+8;
  const handY = hipY + 4, handX = cx + m.hp + r - 1;
  const left = limb(cx-topX+cx*0, topY, cx-(handX-cx), handY, r); // mirrored below via explicit
  const armL = limb(cx - m.sh*0.86, topY, cx - (m.hp + r - 1), handY, r);
  const armR = limb(cx + m.sh*0.86, topY, cx + (m.hp + r - 1), handY, r);
  return `<path d="${armL}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
         `<path d="${armR}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`;
}

function buildHands(g, state, P){
  const {cx, hipY} = g; const m=g.bm;
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.22);
  const r = m.arm+0.5, y = hipY+8, x = m.hp + m.arm - 1;
  return `<circle cx="${R(cx-x)}" cy="${R(y)}" r="${R(r)}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
         `<circle cx="${R(cx+x)}" cy="${R(y)}" r="${R(r)}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`;
}

function buildLegs(g, state, P){
  const {cx, crotchY, ankleY, footY, seated, kneeY} = g; const m=g.bm;
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.22);
  const r = m.leg;
  const hipX = m.hp*0.46;
  let legL, legR, feet;
  if(seated){
    // thigh forward (foreshortened) then shin down to footplate
    const kx = m.hp*0.5, ky = crotchY+6;
    legL = limb(cx-hipX, crotchY, cx-kx, ky, r) + limb(cx-kx, ky, cx-kx, ankleY, r*0.92);
    legR = limb(cx+hipX, crotchY, cx+kx, ky, r) + limb(cx+kx, ky, cx+kx, ankleY, r*0.92);
    feet = `<ellipse cx="${R(cx-m.hp*0.5)}" cy="${R(footY-2)}" rx="${R(r*1.0)}" ry="9" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
           `<ellipse cx="${R(cx+m.hp*0.5)}" cy="${R(footY-2)}" rx="${R(r*1.0)}" ry="9" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`;
  } else {
    legL = limb(cx-hipX, crotchY, cx-hipX, ankleY, r);
    legR = limb(cx+hipX, crotchY, cx+hipX, ankleY, r);
    feet = `<path d="M ${R(cx-hipX-r)} ${R(ankleY)} Q ${R(cx-hipX-r)} ${R(footY)} ${R(cx-hipX+2)} ${R(footY)} L ${R(cx-hipX+r)} ${R(footY)} Q ${R(cx-hipX+r+3)} ${R(footY)} ${R(cx-hipX+r+3)} ${R(ankleY+2)} Z" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
           `<path d="M ${R(cx+hipX+r)} ${R(ankleY)} Q ${R(cx+hipX+r)} ${R(footY)} ${R(cx+hipX-2)} ${R(footY)} L ${R(cx+hipX-r)} ${R(footY)} Q ${R(cx+hipX-r-3)} ${R(footY)} ${R(cx+hipX-r-3)} ${R(ankleY+2)} Z" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`;
  }
  return `<path d="${legL}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
         `<path d="${legR}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+ feet;
}

function buildNeck(g, state, P){
  const {cx, neckTopY, shoulderY} = g;
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.22);
  const w = 16;
  return `<path d="M ${cx-w} ${R(neckTopY)} L ${cx-w} ${R(shoulderY-4)} Q ${cx} ${R(shoulderY+4)} ${cx+w} ${R(shoulderY-4)} L ${cx+w} ${R(neckTopY)} Z" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.5"/>`+
         `<path d="M ${cx-w} ${R(shoulderY-6)} Q ${cx} ${R(shoulderY+2)} ${cx+w} ${R(shoulderY-6)}" fill="#000" opacity="0.08"/>`;
}

function buildHead(g, state, P){
  const skinStroke = shade(byId(CAT.skin,state.skin).base, -0.20);
  const path = headPath(g);
  // ears
  const {cx, headCY, headRX} = g;
  const skinStr = `url(#${P}skin)`;
  const ears = `<ellipse cx="${R(cx-headRX+1)}" cy="${R(headCY+8)}" rx="8" ry="12" fill="${skinStr}" stroke="${skinStroke}" stroke-width="1.5"/>`+
    `<ellipse cx="${R(cx+headRX-1)}" cy="${R(headCY+8)}" rx="8" ry="12" fill="${skinStr}" stroke="${skinStroke}" stroke-width="1.5"/>`;
  return ears +
    `<path d="${path}" fill="url(#${P}skin)" stroke="${skinStroke}" stroke-width="1.6"/>`+
    `<path d="${path}" fill="url(#${P}cheek)"/>`;
}

/* clip to face so features/shadows stay inside the head */
function faceClip(g, P){
  return `<clipPath id="${P}face">${`<path d="${headPath(g)}"/>`}</clipPath>`;
}

function buildFeatures(g, state, P){
  if(state.feature==='none') return buildPiercings(g, state, P);
  const {cx, headCY, headRX, headRY} = g;
  const skin = byId(CAT.skin, state.skin).base;
  let inner = '';
  if(state.feature==='freckles'){
    const c = shade(skin,-0.18);
    const pts = [[-22,26],[-15,30],[-9,27],[20,27],[14,31],[8,28],[-3,33],[3,33],[-18,22],[17,23]];
    pts.forEach(p=> inner += `<circle cx="${R(cx+p[0])}" cy="${R(headCY+p[1]-14)}" r="1.7" fill="${c}" opacity="0.6"/>`);
  } else if(state.feature==='vitiligo'){
    const c = shade(skin, 0.5);
    const blobs = [[-20,18,11,9],[16,30,13,10],[6,46,9,7],[-12,44,8,6],[24,8,7,8]];
    blobs.forEach(b=> inner += `<ellipse cx="${R(cx+b[0])}" cy="${R(headCY+b[1]-14)}" rx="${b[2]}" ry="${b[3]}" fill="${c}" opacity="0.85"/>`);
  } else if(state.feature==='birthmark'){
    const c = shade(skin,-0.3);
    inner += `<ellipse cx="${R(cx+18)}" cy="${R(headCY+18)}" rx="9" ry="7" fill="${c}" opacity="0.5"/>`;
  } else if(state.feature==='scar'){
    const c = shade(skin,0.18);
    inner += `<path d="M ${R(cx-24)} ${R(headCY-2)} q 3 8 0 16" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7"/>`;
  } else if(state.feature==='blush'){
    const c = mix(skin,'#d96b5a',0.5);
    inner += `<ellipse cx="${R(cx-22)}" cy="${R(headCY+20)}" rx="11" ry="7" fill="${c}" opacity="0.35"/>`+
             `<ellipse cx="${R(cx+22)}" cy="${R(headCY+20)}" rx="11" ry="7" fill="${c}" opacity="0.35"/>`;
  }
  return `<g clip-path="url(#${P}face)">${inner}</g>` + buildPiercings(g, state, P);
}

function buildBrows(g, state, P){
  const {cx, browY, eyeDX} = g;
  const c = shade(byId(CAT.hairColor, state.hairColor).v, -0.06);
  const t = state.brow;
  function one(side){
    const x = cx + side*eyeDX;
    if(t==='straight') return `<rect x="${R(x-11)}" y="${R(browY-2)}" width="22" height="4.5" rx="2.2" fill="${c}"/>`;
    if(t==='arched')   return `<path d="M ${R(x-11)} ${R(browY+2)} Q ${R(x)} ${R(browY-8)} ${R(x+11)} ${R(browY+1)}" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    if(t==='thick')    return `<path d="M ${R(x-12)} ${R(browY+1)} Q ${R(x)} ${R(browY-5)} ${R(x+12)} ${R(browY+1)}" stroke="${c}" stroke-width="6.5" fill="none" stroke-linecap="round"/>`;
    if(t==='thin')     return `<path d="M ${R(x-10)} ${R(browY+1)} Q ${R(x)} ${R(browY-4)} ${R(x+10)} ${R(browY+1)}" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    return `<path d="M ${R(x-11)} ${R(browY+1)} Q ${R(x)} ${R(browY-5)} ${R(x+11)} ${R(browY+1)}" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`; // soft
  }
  return one(-1)+one(1);
}

/* eye dimensions by type — shared by buildEyes and buildMakeup so they align */
function eyeDims(t){
  let rx=8, ry=7;
  if(t==='almond'){ rx=9; ry=6; }
  else if(t==='monolid'){ rx=9; ry=5.4; }
  else if(t==='hooded'){ rx=8.5; ry=6; }
  else if(t==='wide'){ rx=8; ry=7; }
  return { rx, ry };
}

function buildEyes(g, state, P){
  const {cx, eyeY, eyeDX} = g;
  const t = state.eye;
  const col = byId(CAT.eyeColor, state.eyeColor) || CAT.eyeColor[0];
  const white = '#fff', iris = col.v, irisD = col.d, line = '#2c2622';
  function one(side){
    const x = cx + side*eyeDX;
    let lid='';
    const {rx, ry} = eyeDims(t);
    const sclera = `<ellipse cx="${R(x)}" cy="${R(eyeY)}" rx="${rx}" ry="${ry}" fill="${white}" stroke="${shade(line,0.3)}" stroke-width="0.8"/>`;
    const irisG = `<circle cx="${R(x)}" cy="${R(eyeY)}" r="${R(ry*0.86)}" fill="${iris}"/>`+
                  `<circle cx="${R(x)}" cy="${R(eyeY)}" r="${R(ry*0.42)}" fill="${irisD}"/>`+
                  `<circle cx="${R(x-1.6)}" cy="${R(eyeY-1.8)}" r="1.5" fill="#fff" opacity="0.9"/>`;
    if(t==='hooded') lid = `<path d="M ${R(x-rx-1)} ${R(eyeY-ry+1)} Q ${R(x)} ${R(eyeY-ry-2)} ${R(x+rx+1)} ${R(eyeY-ry+1)} L ${R(x+rx)} ${R(eyeY-ry*0.2)} Q ${R(x)} ${R(eyeY-ry*1.1)} ${R(x-rx)} ${R(eyeY-ry*0.2)} Z" fill="${line}" opacity="0.16"/>`;
    if(t==='monolid') lid = `<path d="M ${R(x-rx)} ${R(eyeY-ry-0.5)} Q ${R(x)} ${R(eyeY-ry-3)} ${R(x+rx)} ${R(eyeY-ry-0.5)}" stroke="${line}" stroke-width="1.2" fill="none" opacity="0.5"/>`;
    const topLid = `<path d="M ${R(x-rx-1)} ${R(eyeY-ry*0.5)} Q ${R(x)} ${R(eyeY-ry-1.5)} ${R(x+rx+1)} ${R(eyeY-ry*0.5)}" stroke="${line}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    return `<g clip-path="url(#${P}eye${side<0?'L':'R'})">${sclera}${irisG}</g>`+
           `<clipPath id="${P}eye${side<0?'L':'R'}"><ellipse cx="${R(x)}" cy="${R(eyeY)}" rx="${rx}" ry="${ry}"/></clipPath>`+
           sclera.replace('fill="'+white+'"','fill="none"') + topLid + lid;
  }
  return `<g class="avatarBlink" style="--eye-y:${R(eyeY)}px">${one(-1)+one(1)}</g>`;
}

function buildNose(g, state, P){
  const {cx, noseY} = g;
  const skin = byId(CAT.skin, state.skin).base;
  const sh = shade(skin,-0.16), hi = shade(skin,0.12);
  const t = state.nose;
  let w=6, h=12;
  if(t==='button'){ w=5; h=9; }
  else if(t==='wide'){ w=9; h=11; }
  else if(t==='narrow'){ w=4; h=13; }
  else if(t==='long'){ w=5.5; h=17; }
  const topY = noseY - h*0.7;
  return `<path d="M ${cx} ${R(topY)} Q ${R(cx-w*0.5)} ${R(noseY-2)} ${R(cx-w)} ${R(noseY+2)} Q ${R(cx-w*0.4)} ${R(noseY+5)} ${cx} ${R(noseY+4)} Q ${R(cx+w*0.4)} ${R(noseY+5)} ${R(cx+w)} ${R(noseY+2)} Q ${R(cx+w*0.5)} ${R(noseY-2)} ${cx} ${R(topY)} Z" fill="${sh}" opacity="0.28"/>`+
         `<path d="M ${R(cx-w*0.7)} ${R(noseY+3)} Q ${cx} ${R(noseY+6)} ${R(cx+w*0.7)} ${R(noseY+3)}" stroke="${sh}" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round"/>`;
}

function buildPiercings(g, state, P){
  const t = state.piercing;
  if(t==='none' || !t) return '';
  const {cx, noseY, eyeY, eyeDX, browY, mouthY} = g;
  let s = '';
  // metal color
  const metal = '#d4dce0', dark = '#7a8185';
  if(t==='nostril'){
    s += `<circle cx="${R(cx+5)}" cy="${R(noseY+5)}" r="1.3" fill="${metal}" stroke="${dark}" stroke-width="0.7"/>`;
  } else if(t==='septum'){
    s += `<path d="M ${R(cx-3)} ${R(noseY+6)} A 3.5 3.5 0 0 0 ${R(cx+3)} ${R(noseY+6)}" stroke="${metal}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M ${R(cx-3)} ${R(noseY+6)} A 3.5 3.5 0 0 0 ${R(cx+3)} ${R(noseY+6)}" stroke="${dark}" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.6"/>`;
  } else if(t==='eyebrow'){
    s += `<circle cx="${R(cx-eyeDX-8)}" cy="${R(browY-3)}" r="1.3" fill="${metal}" stroke="${dark}" stroke-width="0.7"/>`;
    s += `<circle cx="${R(cx-eyeDX-9)}" cy="${R(browY+3)}" r="1.3" fill="${metal}" stroke="${dark}" stroke-width="0.7"/>`;
  } else if(t==='snake'){
    const w = lipDims(state.lip).w;
    s += `<circle cx="${R(cx-w*0.3)}" cy="${R(mouthY+5)}" r="1.3" fill="${metal}" stroke="${dark}" stroke-width="0.7"/>`;
    s += `<circle cx="${R(cx+w*0.3)}" cy="${R(mouthY+5)}" r="1.3" fill="${metal}" stroke="${dark}" stroke-width="0.7"/>`;
  }
  return s;
}

function buildJewelry(g, state, P){
  const t = state.jewelry;
  if(t==='none' || !t) return '';
  const {cx, headCY, headRX, neckTopY, shoulderY} = g;
  const metal = '#dcc07a', dark = '#a87c58';
  let s = '';
  if(t==='studs'){
    s += `<circle cx="${R(cx-headRX-1)}" cy="${R(headCY+14)}" r="2" fill="${metal}" stroke="${dark}" stroke-width="1"/>`;
    s += `<circle cx="${R(cx+headRX+1)}" cy="${R(headCY+14)}" r="2" fill="${metal}" stroke="${dark}" stroke-width="1"/>`;
  } else if(t==='hoops'){
    s += `<ellipse cx="${R(cx-headRX-1)}" cy="${R(headCY+18)}" rx="3.5" ry="6" fill="none" stroke="${metal}" stroke-width="1.8"/>`;
    s += `<ellipse cx="${R(cx-headRX-1)}" cy="${R(headCY+18)}" rx="3.5" ry="6" fill="none" stroke="${dark}" stroke-width="0.6" opacity="0.6"/>`;
    s += `<ellipse cx="${R(cx+headRX+1)}" cy="${R(headCY+18)}" rx="3.5" ry="6" fill="none" stroke="${metal}" stroke-width="1.8"/>`;
    s += `<ellipse cx="${R(cx+headRX+1)}" cy="${R(headCY+18)}" rx="3.5" ry="6" fill="none" stroke="${dark}" stroke-width="0.6" opacity="0.6"/>`;
  } else if(t==='pearl'){
    s += `<circle cx="${R(cx-headRX-1)}" cy="${R(headCY+14)}" r="1" fill="${metal}"/>`;
    s += `<circle cx="${R(cx-headRX-1)}" cy="${R(headCY+19)}" r="2.5" fill="#fff" stroke="#d2d2d2" stroke-width="0.8"/>`;
    s += `<circle cx="${R(cx+headRX+1)}" cy="${R(headCY+14)}" r="1" fill="${metal}"/>`;
    s += `<circle cx="${R(cx+headRX+1)}" cy="${R(headCY+19)}" r="2.5" fill="#fff" stroke="#d2d2d2" stroke-width="0.8"/>`;
  } else if(t==='chain'){
    s += `<path d="M ${R(cx-14)} ${R(neckTopY+4)} Q ${cx} ${R(shoulderY+2)} ${R(cx+14)} ${R(neckTopY+4)}" stroke="${metal}" stroke-width="2.5" fill="none" stroke-dasharray="3 1"/>`;
    s += `<path d="M ${R(cx-14)} ${R(neckTopY+4)} Q ${cx} ${R(shoulderY+2)} ${R(cx+14)} ${R(neckTopY+4)}" stroke="${dark}" stroke-width="1" fill="none" opacity="0.4"/>`;
  }
  return s;
}

function buildHearing(g, state, P){
  const t = state.hearing;
  if(t==='none' || !t) return '';
  const {cx, headCY, headRX} = g;
  const col = '#d2d2d2', str = '#8a8a8a';
  let s = '';
  function ha(side){
    const x = cx + side*(headRX+2);
    return `<path d="M ${R(x-side*3)} ${R(headCY+10)} Q ${R(x+side*3)} ${R(headCY+6)} ${R(x+side*1)} ${R(headCY+1)}" stroke="${col}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`+
           `<path d="M ${R(x-side*3)} ${R(headCY+10)} Q ${R(x+side*3)} ${R(headCY+6)} ${R(x+side*1)} ${R(headCY+1)}" stroke="${str}" stroke-width="1" fill="none" opacity="0.5"/>`;
  }
  function ci(side){
    const x = cx + side*(headRX+3);
    const wireX = cx + side*(headRX-2);
    return `<circle cx="${R(wireX)}" cy="${R(headCY-5)}" r="5" fill="${col}" stroke="${str}" stroke-width="1"/>`+
           `<path d="M ${R(wireX)} ${R(headCY)} Q ${R(x+side*2)} ${R(headCY+12)} ${R(x-side*2)} ${R(headCY+12)}" stroke="${str}" stroke-width="1.5" fill="none"/>`+
           `<rect x="${R(x-3)}" y="${R(headCY+8)}" width="6" height="8" rx="2" fill="${col}" stroke="${str}" stroke-width="1"/>`;
  }
  if(t==='ha_r') s += ha(1);
  if(t==='ha_l') s += ha(-1);
  if(t==='ci_both') { s += ci(-1) + ci(1); }
  return s;
}

function buildAura(g, state, P){
  const a = byId(CAT.aura, state.aura);
  if(!a || !a.c) return '';
  const r = 260;
  return `<ellipse cx="160" cy="${R(g.chestY)}" rx="${r}" ry="${r}" fill="url(#${P}aura)" opacity="0.6"/>`;
}

function buildLips(g, state, P){
  const {cx, mouthY} = g;
  const skin = byId(CAT.skin, state.skin).base;
  const lip = mix(skin, '#b5544c', 0.42);
  const lipD = shade(lip,-0.18);
  const t = state.lip;
  let w=15, h=6;
  if(t==='wide'){ w=19; h=5; }
  else if(t==='small'){ w=11; h=5; }
  else if(t==='bow'){ w=14; h=6.5; }
  else if(t==='neutral'){ w=14; h=4.5; }
  const cupid = (t==='bow') ? `Q ${R(cx-w*0.25)} ${R(mouthY-3)} ${cx} ${R(mouthY-1)} Q ${R(cx+w*0.25)} ${R(mouthY-3)} ${R(cx+w*0.5)} ${R(mouthY-1)}`
                            : `Q ${cx} ${R(mouthY-2)} ${R(cx+w*0.5)} ${R(mouthY-1)}`;
  const top = `M ${R(cx-w*0.5)} ${R(mouthY-1)} ${cupid} Q ${cx} ${R(mouthY-2)} ${R(cx-w*0.5)} ${R(mouthY-1)} Z`;
  return `<path d="M ${R(cx-w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY-2)} ${R(cx+w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY-1+h)} ${R(cx-w*0.5)} ${R(mouthY-1)} Z" fill="${lip}" stroke="${lipD}" stroke-width="0.8"/>`+
         `<path d="M ${R(cx-w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY+1)} ${R(cx+w*0.5)} ${R(mouthY-1)}" stroke="${lipD}" stroke-width="1" fill="none" opacity="0.6"/>`;
}

/* lip width/height by type — shared by buildLips and buildMakeup */
function lipDims(t){
  let w=15, h=6;
  if(t==='wide'){ w=19; h=5; }
  else if(t==='small'){ w=11; h=5; }
  else if(t==='bow'){ w=14; h=6.5; }
  else if(t==='neutral'){ w=14; h=4.5; }
  return { w, h };
}

/* ---- Makeup: drawn over eyes & lips; everything is optional & reversible ---- */
function buildMakeup(g, state, P){
  const t = state.makeup;
  if(t==='none') return '';
  const {cx, eyeY, eyeDX, mouthY} = g;
  const col = byId(CAT.makeupColor, state.makeupColor).v;
  const skin = byId(CAT.skin, state.skin).base;
  const dark = '#241f1d';
  const ed = eyeDims(state.eye);
  const wantShadow  = (t==='smoky'||t==='glam'||t==='natural');
  const wantLiner   = (t==='liner'||t==='smoky'||t==='glam');
  const wantWing    = (t==='liner'||t==='glam');
  const wantLashes  = (t==='mascara'||t==='glam'||t==='smoky'||t==='natural');
  const wantGraphic = (t==='graphic');
  const wantLip     = (t==='bold'||t==='glam'||t==='natural');
  let s = '';
  for(const side of [-1,1]){
    const x = cx + side*eyeDX;
    if(wantShadow){
      const op = (t==='natural')?0.22:(t==='smoky'?0.55:0.42);
      const lift = (t==='smoky')? ed.ry+7 : ed.ry+3.5;
      const shCol = (t==='natural')? shade(skin,-0.18) : (t==='smoky'? shade(col,-0.3) : col);
      s += `<path d="M ${R(x-ed.rx-1)} ${R(eyeY-ed.ry*0.35)} Q ${R(x)} ${R(eyeY-lift)} ${R(x+ed.rx+1)} ${R(eyeY-ed.ry*0.35)} Q ${R(x)} ${R(eyeY-ed.ry-1)} ${R(x-ed.rx-1)} ${R(eyeY-ed.ry*0.35)} Z" fill="${shCol}" opacity="${op}"/>`;
    }
    if(wantLiner){
      const inner = x - side*ed.rx;
      const outer = x + side*ed.rx;
      let d = `M ${R(inner)} ${R(eyeY-1)} Q ${R(x)} ${R(eyeY-ed.ry-1.5)} ${R(outer)} ${R(eyeY-2)}`;
      if(wantWing) d += ` L ${R(outer+side*7)} ${R(eyeY-7)}`;
      s += `<path d="${d}" stroke="${dark}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    if(wantGraphic){
      const inner = x - side*ed.rx;
      const outer = x + side*(ed.rx+4);
      s += `<path d="M ${R(inner)} ${R(eyeY-ed.ry-2)} Q ${R(x)} ${R(eyeY-ed.ry-7)} ${R(outer)} ${R(eyeY-ed.ry-3)} L ${R(outer+side*6)} ${R(eyeY-ed.ry-9)}" stroke="${col}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      s += `<path d="M ${R(x-side*ed.rx)} ${R(eyeY-1)} Q ${R(x)} ${R(eyeY-ed.ry-1.5)} ${R(x+side*ed.rx)} ${R(eyeY-2)}" stroke="${dark}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    }
    if(wantLashes){
      const outer = x + side*ed.rx;
      for(let k=0;k<3;k++){
        const px = outer - side*(k*3);
        s += `<line x1="${R(px)}" y1="${R(eyeY-ed.ry+1)}" x2="${R(px+side*2)}" y2="${R(eyeY-ed.ry-3-k*0.5)}" stroke="${dark}" stroke-width="1.4" stroke-linecap="round"/>`;
      }
    }
  }
  if(wantLip){
    const {w, h} = lipDims(state.lip);
    const op = (t==='natural')?0.4:0.85;
    const lipFill = (t==='natural')? mix(skin, col, 0.5) : col;
    s += `<path d="M ${R(cx-w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY-2)} ${R(cx+w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY-1+h)} ${R(cx-w*0.5)} ${R(mouthY-1)} Z" fill="${lipFill}" opacity="${op}"/>`+
         `<path d="M ${R(cx-w*0.5)} ${R(mouthY-1)} Q ${cx} ${R(mouthY+1)} ${R(cx+w*0.5)} ${R(mouthY-1)}" stroke="${shade(lipFill,-0.22)}" stroke-width="1" fill="none" opacity="0.6"/>`;
  }
  return s;
}

/* Sleek "hair down" styles come from Avataaars (Pablo Stanley, free for personal
   & commercial use), mapped onto the dmFigure ellipse head (Avataaars head =
   circle center 132,92 r56) by one affine derived from geo. */
function avaHair(geo, hid){
  const spec = AVA_HAIR[hid];
  if(!spec) return '';
  const sx = geo.headRx/56, sy = geo.headRy/56;
  const tx = geo.cx - sx*132, ty = geo.headCy - sy*92;
  const T = `translate(${tx.toFixed(3)} ${ty.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})`;
  let s = `<g transform="translate(${spec.ho[0]} ${spec.ho[1]})"><path d="${spec.hd}" fill="${geo.fill}"/></g>`;
  if(spec.sh) for(const sh of spec.sh) s += `<path transform="translate(-1 0)" d="${sh.d}" fill="#000" fill-opacity="${sh.o}"/>`;
  return `<g transform="${T}">${s}</g>`;
}

/* ---- Hand-built styled hair: the sister's looks (updos, braids, ponytails),
        drawn natively in dmFigure head space, recolorable via geo.fill, with
        gradient sheen + shadow for dimension. Each builder returns {back,front}. ---- */

/* shaved = a faint hair shadow on the scalp; bald = nothing. */
/* ---- Illustrated image hair: a flat grayscale PNG recolored in-file via an
        SVG luminance->color filter. Placement is geo-relative so it tracks the
        head at any body/height. (Hybrid approach: hair art drawn by eye, body
        stays vector.) ---- */
const HAIR_IMG = {
  braid: { src:'_art/sideBraid_cut.png', wRx:2.69, ar:1.798, dx:0, dyTop:-0.35 },
};
function hcImg(geo, hid){
  const m = HAIR_IMG[hid]; if(!m) return null;
  const loH = shade(geo.mid, -0.45), hiH = shade(geo.mid, 0.42);
  const lo = hexToRgb(loH), hi = hexToRgb(hiH);
  const w = m.wRx*geo.headRx, h = w*m.ar;
  const x = geo.cx - w/2 + (m.dx||0)*geo.headRx, y = geo.topY + m.dyTop*geo.headRx;
  const fid = `hif_${hid}_${loH.slice(1)}`;
  return `<filter id="${fid}" color-interpolation-filters="sRGB"><feComponentTransfer>`
    + `<feFuncR type="table" tableValues="${(lo.r/255).toFixed(3)} ${(hi.r/255).toFixed(3)}"/>`
    + `<feFuncG type="table" tableValues="${(lo.g/255).toFixed(3)} ${(hi.g/255).toFixed(3)}"/>`
    + `<feFuncB type="table" tableValues="${(lo.b/255).toFixed(3)} ${(hi.b/255).toFixed(3)}"/>`
    + `</feComponentTransfer></filter>`
    + `<image href="${m.src}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" filter="url(#${fid})"/>`;
}
function sharedHairBack(geo, hid){ if(HAIR_IMG[hid]) return ''; const b = HAIR_HC[hid]; return b ? (b(geo).back || '') : ''; }
function sharedHairFront(geo, hid){
  if(hid==='bald') return '';
  if(hid==='shaved') return `<g opacity="0.5">${hcCap(geo)}</g>`;
  const im = hcImg(geo, hid); if(im) return im;
  const b = HAIR_HC[hid];
  if(b) return b(geo).front;
  return avaHair(geo, hid);
}

/* laid edges / baby hairs along the hairline — echoes styled edges */
function hairEdges(g, dark){
  const {cx, headCY, headRX, headRY} = g;
  const hy = headCY - headRY*0.40;
  let s='';
  s += `<path d="M ${R(cx-headRX*0.46)} ${R(hy)} q -11 7 -18 4" stroke="${dark}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>`;
  s += `<path d="M ${R(cx-headRX*0.46)} ${R(hy+3.5)} q -9 8 -15 7" stroke="${dark}" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.45"/>`;
  s += `<path d="M ${R(cx+headRX*0.46)} ${R(hy)} q 11 7 18 4" stroke="${dark}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>`;
  s += `<path d="M ${R(cx+headRX*0.46)} ${R(hy+3.5)} q 9 8 15 7" stroke="${dark}" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.45"/>`;
  return s;
}

function buildHairBack(g, state, P){
  const c = byId(CAT.hairColor, state.hairColor).v;
  const geo = {
    cx: g.cx, headCy: g.headCY, headRx: g.headRX, headRy: g.headRY,
    topY: g.headCY - g.headRY,
    crownY: g.headCY - g.headRY * 0.55,
    hairlineY: g.headCY - g.headRY * 0.42,
    napeY: g.headCY + g.headRY + 6,
    fallTo: g.shoulderY + 54,
    fill: `url(#${P}hair)`,
    dark: shade(c, -0.26), mid: shade(c, -0.12), lite: shade(c, 0.18),
    R,
  };
  return sharedHairBack(geo, state.hair);
}

function buildHairFront(g, state, P){
  const c = byId(CAT.hairColor, state.hairColor).v;
  const geo = {
    cx: g.cx, headCy: g.headCY, headRx: g.headRX, headRy: g.headRY,
    topY: g.headCY - g.headRY,

/* ---------------------------- GARMENTS ---------------------------- */
function texOverlay(P, pathD, texId, key){
  // overlay a texture pattern clipped to a garment path
  const cid = `${P}clip_${key}`;
  return `<clipPath id="${cid}"><path d="${pathD}"/></clipPath>`+
         `<rect x="0" y="0" width="${VIEW.w}" height="${VIEW.h}" fill="url(#${texId})" clip-path="url(#${cid})"/>`;
}

function topPath(g, t){
  const {cx, shoulderY, chestY, waistY, hipY} = g; const m=g.bm;
  const fitBoost = t.fit==='oversized' ? 13 : t.fit==='boxy' ? 9 : t.fit==='relaxed' ? 6 : t.fit==='fitted' ? -4 : 3;
  const sh=m.sh+4+fitBoost, ch=m.ch+5+fitBoost, wa=m.wa+5+(t.fit==='fitted'?-7:fitBoost*.55), hp=m.hp+5+(t.fit==='oversized'?12:t.fit==='boxy'?9:t.fit==='fitted'?-5:4);
  const bottomY = t.len==='dress' ? g.kneeY-4 : t.len==='crop' ? waistY+8 : t.len==='boxy' ? hipY-20 : t.len==='long' ? hipY+25 : hipY+8;
  const flare = t.len==='dress' ? (t.satin?10:18) : t.fit==='oversized' ? 6 : 0;
  const neckW = t.neck==='scoop'?17:t.neck==='collar'?12:t.neck==='v'?18:t.neck==='high'?8:t.neck==='asym'?24:13;
  const neckD = t.neck==='scoop'?15:t.neck==='collar'?6:t.neck==='v'?24:t.neck==='high'?2:t.neck==='asym'?22:8;

  let topEdge = `L ${R(cx+neckW)} ${R(shoulderY-1)}
    C ${R(cx+neckW*0.7)} ${R(shoulderY-1+neckD)}, ${R(cx+neckW*0.5)} ${R(shoulderY+neckD)}, ${cx} ${R(shoulderY+neckD)}
    C ${R(cx-neckW*0.5)} ${R(shoulderY+neckD)}, ${R(cx-neckW*0.7)} ${R(shoulderY-1+neckD)}, ${R(cx-neckW)} ${R(shoulderY-1)}`;

  if (t.neck === 'asym') {
    topEdge = `L ${R(cx+neckW*1.2)} ${R(shoulderY+14)} C ${cx} ${R(shoulderY+30)}, ${R(cx-neckW*0.2)} ${R(shoulderY+6)}, ${R(cx-neckW)} ${R(shoulderY-2)}`;
  }

  return `M ${R(cx-sh)} ${R(shoulderY-2)}
    C ${R(cx-ch)} ${R(chestY-2)}, ${R(cx-wa-2)} ${R(waistY-10)}, ${R(cx-wa)} ${R(waistY)}
    C ${R(cx-wa)} ${R(waistY+8)}, ${R(cx-hp-flare)} ${R(hipY-6)}, ${R(cx-hp-flare)} ${R(bottomY)}
    Q ${cx} ${R(bottomY+5)} ${R(cx+hp+flare)} ${R(bottomY)}
    C ${R(cx+hp+flare)} ${R(hipY-6)}, ${R(cx+wa)} ${R(waistY+8)}, ${R(cx+wa)} ${R(waistY)}
    C ${R(cx+wa+2)} ${R(waistY-10)}, ${R(cx+ch)} ${R(chestY-2)}, ${R(cx+sh)} ${R(shoulderY-2)}
    ${topEdge}
    L ${R(cx-sh)} ${R(shoulderY-2)} Z`;
}

function buildTop(g, state, P){
  const t = byId(CAT.top, state.top);
  const c = state.topColor; const fill = `url(#${P}top)`;
  const stroke = shade(c,-0.18);
  const m=g.bm; const {cx, shoulderY, chestY, waistY, hipY, kneeY} = g;
  const bottomY = t.len==='dress' ? kneeY-4 : t.len==='crop' ? waistY+8 : t.len==='boxy' ? hipY-20 : t.len==='long' ? hipY+25 : hipY+8;
  const accent = luminance(c) > .45 ? shade(c,-0.28) : shade(c,0.28);
  let s = '';
  // hood behind neck
  if(t.hood){ s += `<path d="M ${R(cx-34)} ${R(shoulderY-1)} Q ${cx} ${R(shoulderY-34)} ${R(cx+34)} ${R(shoulderY-1)} Q ${cx} ${R(shoulderY+12)} ${R(cx-34)} ${R(shoulderY-1)} Z" fill="${shade(c,-0.08)}" stroke="${stroke}" stroke-width="1.2"/>`; }
  // sleeves — clipped to the shoulder line so the rounded caps never poke above it
  const armTopY = shoulderY+6;
  let sleeves = '';
  if(t.sleeve==='long'){
    const handY = hipY+4;
    const sl = m.arm + (t.fit==='oversized'?8:t.fit==='relaxed'?5:3);
    sleeves += `<path d="${limb(cx-m.sh*0.86, armTopY, cx-(m.hp+m.arm-1), handY, sl)}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
    sleeves += `<path d="${limb(cx+m.sh*0.86, armTopY, cx+(m.hp+m.arm-1), handY, sl)}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
  } else if(t.sleeve==='short'){
    const sl = m.arm + (t.fit==='oversized'?7:3.5);
    const drop = t.fit==='oversized'?34:26;
    sleeves += `<path d="${limb(cx-m.sh*0.86, armTopY, cx-m.sh*0.92, armTopY+drop, sl)}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
    sleeves += `<path d="${limb(cx+m.sh*0.86, armTopY, cx+m.sh*0.92, armTopY+drop, sl)}" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
  }
  if(sleeves){
    s += `<clipPath id="${P}slv"><rect x="0" y="${R(shoulderY-2)}" width="${VIEW.w}" height="${VIEW.h}"/></clipPath>`+
         `<g clip-path="url(#${P}slv)">${sleeves}</g>`;
  }
  const path = topPath(g, t);
  s += `<path d="${path}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
  // texture overlay
  const tex = byId(CAT.texture, state.texture);
  s += texOverlay(P, path, tex.pat, 'top');
  // details
  if(t.mesh){
    for(let yy=shoulderY+18; yy<hipY+4; yy+=12){ s += `<line x1="${R(cx-m.ch-8)}" y1="${R(yy)}" x2="${R(cx+m.ch+8)}" y2="${R(yy+10)}" stroke="${accent}" stroke-width=".8" opacity="0.35"/>`; }
    for(let yy=shoulderY+20; yy<hipY+6; yy+=12){ s += `<line x1="${R(cx+m.ch+8)}" y1="${R(yy)}" x2="${R(cx-m.ch-8)}" y2="${R(yy+10)}" stroke="${accent}" stroke-width=".8" opacity="0.26"/>`; }
  }
  if(t.layered){
    const tw = t.fit==='relaxed' ? m.ch-4 : m.ch;
    s += `<path d="M ${R(cx-tw)} ${R(shoulderY+6)} C ${R(cx-tw-2)} ${R(chestY)}, ${R(cx-tw)} ${R(waistY)}, ${R(cx-tw)} ${R(hipY+24)} L ${R(cx+tw)} ${R(hipY+24)} C ${R(cx+tw)} ${R(waistY)}, ${R(cx+tw+2)} ${R(chestY)}, ${R(cx+tw)} ${R(shoulderY+6)} Q ${cx} ${R(shoulderY+24)} ${R(cx-tw)} ${R(shoulderY+6)} Z" fill="#fcf9f2" stroke="${shade(c,-0.08)}" stroke-width="1"/>`;
    s += `<line x1="${cx}" y1="${R(shoulderY+18)}" x2="${cx}" y2="${R(hipY+24)}" stroke="${shade(c,-0.2)}" stroke-width="2" opacity="0.2"/>`;
  }
  if(t.corset){
    for(let i=-1; i<=1; i+=2) {
      s += `<path d="M ${R(cx+i*9)} ${R(chestY+9)} Q ${R(cx+i*6)} ${R(waistY)} ${R(cx+i*11)} ${R(bottomY-4)}" stroke="${shade(c,-0.12)}" stroke-width="1.2" fill="none"/>`;
      s += `<path d="M ${R(cx+i*22)} ${R(chestY+16)} Q ${R(cx+i*18)} ${R(waistY)} ${R(cx+i*21)} ${R(bottomY-5)}" stroke="${shade(c,-0.12)}" stroke-width="1.2" fill="none"/>`;
    }
    s += `<path d="M ${R(cx-m.ch+4)} ${R(chestY+14)} Q ${cx} ${R(chestY+20)} ${R(cx+m.ch-4)} ${R(chestY+14)}" stroke="${shade(c,-0.12)}" stroke-width="1.2" fill="none"/>`;
  }
  if(t.jersey){
    s += `<text x="${cx}" y="${R(chestY+38)}" font-size="44" font-weight="900" font-family="system-ui" text-anchor="middle" fill="${accent}" opacity="0.85">00</text>`;
    s += `<path d="M ${R(cx-14)} ${R(shoulderY+12)} L ${cx} ${R(shoulderY+26)} L ${R(cx+14)} ${R(shoulderY+12)}" stroke="${accent}" stroke-width="3" fill="none"/>`;
  }
  if(t.graphic){
    s += `<path d="M ${R(cx-18)} ${R(shoulderY+48)} q 18 -18 36 0 q -16 7 -36 0" fill="none" stroke="${accent}" stroke-width="4" opacity="0.62" stroke-linecap="round"/>`;
    s += `<circle cx="${R(cx+20)}" cy="${R(shoulderY+45)}" r="5" fill="${accent}" opacity="0.45"/>`;
  }
  if(t.rib){
    for(let i=-4;i<=4;i++){ const x=cx+i*8; s += `<line x1="${R(x)}" y1="${R(shoulderY+15)}" x2="${R(x+i*.6)}" y2="${R(hipY+4)}" stroke="${accent}" stroke-width=".9" opacity="0.26"/>`; }
  }
  if(t.placket || t.zip){ s += `<line x1="${cx}" y1="${R(shoulderY+10)}" x2="${cx}" y2="${R(hipY+10)}" stroke="${accent}" stroke-width="${t.zip?2:1.4}" opacity="0.75"/>`; 
    if(t.placket){ for(let i=0;i<5;i++){ s+=`<circle cx="${cx}" cy="${R(shoulderY+24+i*20)}" r="1.7" fill="${accent}"/>`; } } }
  if(t.neck==='collar'){ s += `<path d="M ${R(cx-16)} ${R(shoulderY+7)} L ${R(cx-4)} ${R(shoulderY+20)} L ${cx} ${R(shoulderY+10)} L ${R(cx+4)} ${R(shoulderY+20)} L ${R(cx+16)} ${R(shoulderY+7)}" fill="none" stroke="${accent}" stroke-width="1.7"/>`; }
  if(t.neck==='high'){ s += `<rect x="${R(cx-13)}" y="${R(shoulderY-6)}" width="26" height="18" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`; }
  if(t.pocket){ s += `<path d="M ${R(cx-26)} ${R(hipY-24)} h52 v14 q0 7 -7 7 h-38 q-7 0 -7 -7 Z" fill="${shade(c,-0.06)}" stroke="${stroke}" stroke-width="1.2" opacity="0.9"/>`; }
  if(t.pockets){
    [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*18-12)} ${R(shoulderY+54)} h24 v27 h-24 Z" fill="${shade(c,-0.06)}" stroke="${accent}" stroke-width="1" opacity="0.82"/>`);
  }
  if(t.panels){
    s += `<path d="M ${R(cx-m.ch-4)} ${R(shoulderY+34)} Q ${cx} ${R(shoulderY+48)} ${R(cx+m.ch+4)} ${R(shoulderY+34)}" stroke="${accent}" stroke-width="1.4" fill="none" opacity="0.55"/>`;
    [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*24)} ${R(shoulderY+20)} L ${R(cx+sd*34)} ${R(hipY+2)}" stroke="${accent}" stroke-width="1.1" opacity="0.38"/>`);
  }
  if(t.chunky){ for(let i=0;i<6;i++){ const yy=shoulderY+18+i*18; s+=`<path d="M ${R(cx-m.ch-6)} ${R(yy)} q ${R(m.ch+6)} 8 ${R(2*m.ch+12)} 0" stroke="${accent}" stroke-width="1" fill="none" opacity="0.34"/>`; } }
  if(t.satin){
    s += `<path d="M ${R(cx-18)} ${R(shoulderY+25)} C ${R(cx-8)} ${R(shoulderY+72)} ${R(cx-22)} ${R(g.kneeY-20)} ${R(cx-10)} ${R(g.kneeY-8)}" stroke="#fff" stroke-width="6" fill="none" opacity="0.25" stroke-linecap="round"/>`;
  }
  // tank / slip straps
  if(t.sleeve==='tank' || t.sleeve==='strap'){
    const w = t.sleeve==='strap' ? 3 : 7;
    s += `<rect x="${R(cx-m.sh*0.48)}" y="${R(shoulderY-4)}" width="${w}" height="22" rx="${w/2}" fill="${fill}"/>`+
         `<rect x="${R(cx+m.sh*0.48-w)}" y="${R(shoulderY-4)}" width="${w}" height="22" rx="${w/2}" fill="${fill}"/>`;
  }
  return s;
}

function buildBottom(g, state, P){
  const b = byId(CAT.bottom, state.bottom);
  const t = byId(CAT.top, state.top);
  if(t.len==='dress' && (b.type==='skirt')) { /* dress covers; skip skirt */ }
  const c = state.bottomColor; const fill = `url(#${P}bot)`;
  const stroke = shade(c,-0.2);
  const m=g.bm; const {cx, hipY, crotchY, ankleY, kneeY} = g;
  const hipX = m.hp*0.46;
  let s=''; let pathForTex='';
  if(b.type==='skirt'){
    const skirtBottom = b.midi ? g.ankleY-14 : kneeY-6;
    const flare = b.midi ? m.hp+12 : m.hp+18;
    pathForTex = `M ${R(cx-m.hp-2)} ${R(hipY-6)} L ${R(cx-flare)} ${R(skirtBottom)} Q ${cx} ${R(skirtBottom+10)} ${R(cx+flare)} ${R(skirtBottom)} L ${R(cx+m.hp+2)} ${R(hipY-6)} Q ${cx} ${R(hipY+8)} ${R(cx-m.hp-2)} ${R(hipY-6)} Z`;
    s += `<path d="${pathForTex}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
    if(b.pleated){
      for(let i=-4;i<=4;i++){ const xTop=cx+i*m.hp*.22; const xBot=cx+i*flare*.22; s+=`<line x1="${R(xTop)}" y1="${R(hipY+2)}" x2="${R(xBot)}" y2="${R(skirtBottom)}" stroke="${shade(c,-0.25)}" stroke-width="1" opacity="0.35"/>`; }
    } else if(b.cargo){
      [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*flare*.45-sd*22)} ${R(kneeY-34)} h22 v34 h-22 Z" fill="${shade(c,-0.06)}" stroke="${stroke}" stroke-width="1.1" opacity="0.92"/>`);
      s += `<path d="M ${cx} ${R(hipY-6)} v${R(skirtBottom-hipY+6)}" stroke="${shade(c,-0.22)}" stroke-width="1.2" opacity="0.4"/>`;
    } else {
      s += `<path d="M ${R(cx-flare*.45)} ${R(hipY+8)} Q ${R(cx-8)} ${R((hipY+skirtBottom)/2)} ${R(cx-flare*.22)} ${R(skirtBottom-8)}" stroke="#fff" stroke-width="4" fill="none" opacity="0.18" stroke-linecap="round"/>`;
    }
  } else {
    let len = ankleY+2;
    if(b.type==='shorts') len = crotchY + (kneeY-crotchY)*0.5;
    else if(b.type==='jorts') len = kneeY + 18;

    const r = b.type==='legg' ? m.leg+1 : b.type==='wide' ? m.leg+8 : b.type==='barrel' ? m.leg+7 : (b.type==='cargo'||b.type==='jorts') ? m.leg+6 : m.leg+3;
    const legL = limb(cx-hipX, crotchY-2, cx-hipX, len, r);
    const legR = limb(cx+hipX, crotchY-2, cx+hipX, len, r);
    // solid seat fills the whole hip-to-crotch area (no background gaps), with an inseam notch
    const seat = `M ${R(cx-m.hp-1)} ${R(hipY-7)}
      Q ${cx} ${R(hipY+3)} ${R(cx+m.hp+1)} ${R(hipY-7)}
      L ${R(cx+hipX+r)} ${R(crotchY+2)}
      Q ${R(cx+hipX*0.5)} ${R(crotchY+7)} ${cx} ${R(crotchY+1)}
      Q ${R(cx-hipX*0.5)} ${R(crotchY+7)} ${R(cx-hipX-r)} ${R(crotchY+2)} Z`;
    s += `<path d="${seat}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`+
         `<path d="${legL}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`+
         `<path d="${legR}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`+
         `<path d="M ${R(cx-m.hp-1)} ${R(hipY-6)} Q ${cx} ${R(hipY+4)} ${R(cx+m.hp+1)} ${R(hipY-6)}" fill="none" stroke="${stroke}" stroke-width="1.4" opacity="0.6"/>`;
    pathForTex = seat+' '+legL+' '+legR;
    if(b.type==='barrel'){
      [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*(hipX+r*.55))} ${R(crotchY+18)} Q ${R(cx+sd*(hipX+r*1.05))} ${R((crotchY+len)/2)} ${R(cx+sd*(hipX+r*.68))} ${R(len-8)}" stroke="${shade(c,0.12)}" stroke-width="1.4" fill="none" opacity="0.5"/>`);
    }
    if(b.type==='cargo'){
      [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*(hipX+r+2)-sd*22)} ${R(kneeY-34)} h22 v28 h-22 Z" fill="${shade(c,-0.06)}" stroke="${stroke}" stroke-width="1.1" opacity="0.92"/>`);
    }
    if(b.track){
      [-1,1].forEach(sd=> s += `<path d="M ${R(cx+sd*(hipX+r-3))} ${R(hipY)} L ${R(cx+sd*(hipX+r-3))} ${R(len)}" stroke="#f4f6eb" stroke-width="3.5" fill="none" stroke-dasharray="8 0" opacity="0.85"/>`);
    }
    if(b.ruched){
      for(let yy=crotchY+18; yy<len-12; yy+=18){ s += `<path d="M ${R(cx-hipX-r*.7)} ${R(yy)} q ${R(r*.7)} 5 ${R(r*1.4)} 0 M ${R(cx+hipX-r*.7)} ${R(yy)} q ${R(r*.7)} 5 ${R(r*1.4)} 0" stroke="${shade(c,-0.22)}" stroke-width="1" fill="none" opacity="0.38"/>`; }
    }
    if(b.type==='wide' || b.type==='barrel' || b.type==='cargo'){
      [-1,1].forEach(sd=> s += `<line x1="${R(cx+sd*hipX)}" y1="${R(hipY+8)}" x2="${R(cx+sd*hipX)}" y2="${R(len-6)}" stroke="${shade(c,0.16)}" stroke-width="1" opacity="0.45" stroke-dasharray="2 4"/>`);
    }
  }
  const tex = byId(CAT.texture, state.texture);
  s += texOverlay(P, pathForTex, tex.pat, 'bot');
  return s;
}

/* ---------------------------- ACCESSORIES ---------------------------- */
function buildGlasses(g, state, P){
  if(state.glasses==='none') return '';
  const {cx, eyeY, eyeDX} = g;
  const frame = '#4a3f37';
  const t = state.glasses;
  function lens(side){
    const x = cx+side*eyeDX;
    if(t==='round') return `<circle cx="${R(x)}" cy="${R(eyeY)}" r="12" fill="#cfe0e6" fill-opacity="0.25" stroke="${frame}" stroke-width="2.4"/>`;
    if(t==='cat') return `<path d="M ${R(x-12)} ${R(eyeY-2)} Q ${R(x-13)} ${R(eyeY+9)} ${R(x+2)} ${R(eyeY+9)} Q ${R(x+13)} ${R(eyeY+9)} ${R(x+13)} ${R(eyeY-4)} Q ${R(x+6)} ${R(eyeY-10)} ${R(x-12)} ${R(eyeY-2)} Z" fill="#cfe0e6" fill-opacity="0.22" stroke="${frame}" stroke-width="2.4"/>`;
    return `<rect x="${R(x-12)}" y="${R(eyeY-9)}" width="24" height="18" rx="5" fill="#cfe0e6" fill-opacity="0.25" stroke="${frame}" stroke-width="2.4"/>`;
  }
  return lens(-1)+lens(1)+
    `<line x1="${R(cx-eyeDX+12)}" y1="${R(eyeY-1)}" x2="${R(cx+eyeDX-12)}" y2="${R(eyeY-1)}" stroke="${frame}" stroke-width="2.4"/>`+
    `<line x1="${R(cx-eyeDX-12)}" y1="${R(eyeY-2)}" x2="${R(cx-g.headRX)}" y2="${R(eyeY-4)}" stroke="${frame}" stroke-width="2.4"/>`+
    `<line x1="${R(cx+eyeDX+12)}" y1="${R(eyeY-2)}" x2="${R(cx+g.headRX)}" y2="${R(eyeY-4)}" stroke="${frame}" stroke-width="2.4"/>`;
}

function buildMobilityBack(g, state, P){
  if(state.mobility!=='wheelchair') return '';
  const {cx, hipY, shoulderY} = g; const m=g.bm;
  const wheelY = hipY+44, wheelR=50;
  const tyre='#3b3a38', spoke='#8a8782', rim='#5a5854';
  // backrest
  const backTop = shoulderY-4;
  let s = `<rect x="${R(cx-m.sh-6)}" y="${R(backTop)}" width="${R(2*(m.sh+6))}" height="${R(hipY-backTop+10)}" rx="10" fill="#5e6b73" opacity="0.95"/>`;
  // push handles
  s += `<path d="M ${R(cx-m.sh-2)} ${R(backTop)} q -10 -6 -10 -16" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M ${R(cx+m.sh+2)} ${R(backTop)} q 10 -6 10 -16" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  // rear of both big wheels (behind body)
  [-1,1].forEach(sd=>{ const x=cx+sd*(m.hp+30); s+=`<circle cx="${R(x)}" cy="${R(wheelY)}" r="${wheelR}" fill="${tyre}"/><circle cx="${R(x)}" cy="${R(wheelY)}" r="${R(wheelR-7)}" fill="#cfcac2"/><circle cx="${R(x)}" cy="${R(wheelY)}" r="9" fill="${rim}"/>`; for(let k=0;k<8;k++){ const a=k*Math.PI/4; s+=`<line x1="${R(x)}" y1="${R(wheelY)}" x2="${R(x+Math.cos(a)*(wheelR-9))}" y2="${R(wheelY+Math.sin(a)*(wheelR-9))}" stroke="${spoke}" stroke-width="2"/>`; } });
  return s;
}

function buildMobilityFront(g, state, P){
  if(state.mobility==='cane'){
    const {cx, hipY, footY} = g; const m=g.bm;
    const x = cx+m.hp+m.arm+10;
    return `<line x1="${R(x)}" y1="${R(hipY+8)}" x2="${R(x)}" y2="${R(footY+6)}" stroke="#7a5a3a" stroke-width="5" stroke-linecap="round"/>`+
           `<path d="M ${R(x)} ${R(hipY+8)} q -10 0 -10 8" stroke="#7a5a3a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  }
  if(state.mobility!=='wheelchair') return '';
  const {cx, hipY, footY, crotchY} = g; const m=g.bm;
  // seat + armrests + footplate (front)
  let s = `<rect x="${R(cx-m.hp-8)}" y="${R(hipY+6)}" width="${R(2*(m.hp+8))}" height="12" rx="6" fill="#46515a"/>`;
  s += `<rect x="${R(cx-m.hp-12)}" y="${R(crotchY-6)}" width="8" height="${R(hipY-crotchY+18)}" rx="4" fill="#46515a"/>`;
  s += `<rect x="${R(cx+m.hp+4)}" y="${R(crotchY-6)}" width="8" height="${R(hipY-crotchY+18)}" rx="4" fill="#46515a"/>`;
  // footplate
  s += `<rect x="${R(cx-m.hp*0.5-12)}" y="${R(footY+2)}" width="${R(m.hp+24)}" height="8" rx="4" fill="#3b3a38"/>`;
  // small front caster
  s += `<circle cx="${R(cx-m.hp*0.5-6)}" cy="${R(footY+16)}" r="9" fill="#3b3a38"/><circle cx="${R(cx-m.hp*0.5-6)}" cy="${R(footY+16)}" r="3" fill="#777"/>`;
  s += `<circle cx="${R(cx+m.hp*0.5+6)}" cy="${R(footY+16)}" r="9" fill="#3b3a38"/><circle cx="${R(cx+m.hp*0.5+6)}" cy="${R(footY+16)}" r="3" fill="#777"/>`;
  return s;
}

function buildAAC(g, state, P){
  if(state.aac==='none') return '';
  const {cx, hipY} = g; const m=g.bm;
  const w = 64, h = 46, x = cx-w/2, y = hipY-6;
  const skin = `url(#${P}skin)`; const skinStroke = shade(byId(CAT.skin,state.skin).base,-0.22);
  const hands = `<circle cx="${R(x-2)}" cy="${R(y+h-6)}" r="${R(m.arm)}" fill="${skin}" stroke="${skinStroke}" stroke-width="1.5"/>`+
                `<circle cx="${R(x+w+2)}" cy="${R(y+h-6)}" r="${R(m.arm)}" fill="${skin}" stroke="${skinStroke}" stroke-width="1.5"/>`;

  // ---- iPad: sleek consumer tablet, bright clean screen with app tiles ----
  if(state.aac==='ipad'){
    let dev = `<rect x="${R(x)}" y="${R(y)}" width="${w}" height="${h}" rx="8" fill="#d9dde2" stroke="#a7adb5" stroke-width="2"/>`;
    const sx=x+4, sy=y+4, sw=w-8, sh=h-8;
    dev += `<rect x="${R(sx)}" y="${R(sy)}" width="${R(sw)}" height="${R(sh)}" rx="5" fill="#eef3f8"/>`;
    dev += `<circle cx="${R(x+w/2)}" cy="${R(y+3)}" r="0.9" fill="#9aa0a6"/>`; // front camera
    const appColors = ['#5aa9e6','#7ed09b','#f4c75a','#ef8e8e','#b89af0','#5ec8c0','#f3a05a','#9ec96b'];
    const aCols=4, aRows=2, ais=8;
    const gx=(sw-aCols*ais)/(aCols+1), gy=(sh-aRows*ais)/(aRows+1);
    let ai=0;
    for(let r0=0;r0<aRows;r0++) for(let c0=0;c0<aCols;c0++){
      const ax=sx+gx+c0*(ais+gx), ay=sy+gy+r0*(ais+gy)+1;
      dev += `<rect x="${R(ax)}" y="${R(ay)}" width="${ais}" height="${ais}" rx="2.4" fill="${appColors[ai%appColors.length]}"/>`;
      ai++;
    }
    return dev + hands;
  }

  // ---- Letter board: low-tech alphabet spelling board ----
  if(state.aac==='letterboard'){
    let dev = `<rect x="${R(x)}" y="${R(y)}" width="${w}" height="${h}" rx="6" fill="#efe4cf" stroke="#b59c74" stroke-width="2"/>`;
    dev += `<rect x="${R(x+3)}" y="${R(y+3)}" width="${R(w-6)}" height="${R(h-6)}" rx="4" fill="#f6efe0" stroke="#cdb79a" stroke-width="1"/>`;
    const rowsL = ['ABCDEFG','HIJKLMN','OPQRSTU','VWXYZ'];
    const padX=7, padY=9, usableH=h-padY*2, stepX=(w-padX*2)/7;
    rowsL.forEach((row, ri)=>{
      const ly = y + padY + (ri+0.5)*(usableH/rowsL.length);
      for(let ci=0; ci<row.length; ci++){
        const lx = x + padX + (ci+0.5)*stepX;
        dev += `<text x="${R(lx)}" y="${R(ly+2)}" font-size="6" font-weight="700" font-family="system-ui" text-anchor="middle" fill="#4a3f30">${row[ci]}</text>`;
      }
    });
    return dev + hands;
  }

  // ---- tablet / board: picture-symbol communication grid ----
  const cells = ['#d98b6a','#e3c36a','#8fb37e','#7ba7c4','#b58fc0','#e0a3b0'];
  let grid='';
  const cols=3, rows=2, pad=6, cw=(w-pad*2)/cols, chh=(h-pad*2)/rows;
  let idx=0;
  for(let r0=0;r0<rows;r0++) for(let c0=0;c0<cols;c0++){ grid += `<rect x="${R(x+pad+c0*cw+1.5)}" y="${R(y+pad+r0*chh+1.5)}" width="${R(cw-3)}" height="${R(chh-3)}" rx="4" fill="${cells[idx%cells.length]}"/>`; idx++; }
  let dev = `<rect x="${R(x)}" y="${R(y)}" width="${w}" height="${h}" rx="8" fill="#2f3338" stroke="#1d2024" stroke-width="2"/>`;
  if(state.aac==='tablet'){ dev += `<rect x="${R(x+3)}" y="${R(y+3)}" width="${w-6}" height="${h-6}" rx="5" fill="#11324a"/>`; }
  else { dev = `<rect x="${R(x)}" y="${R(y)}" width="${w}" height="${h}" rx="8" fill="#e9dcc4" stroke="#b59c74" stroke-width="2"/>`; }
  // speaker dot
  dev += grid + `<circle cx="${R(x+w-7)}" cy="${R(y+h-6)}" r="2" fill="#cfcfcf"/>`;
  return dev + hands;
}

function buildShoes(g, state, P){
  const sh = byId(CAT.shoe, state.shoe);
  const {cx, ankleY, footY, seated} = g; const m=g.bm;
  const hipX = m.hp*0.46;
  const color = sh.color || '#f1e9d8';
  const sole = sh.sole || shade(color,-0.28);
  const stroke = shade(color,-0.28);
  function one(sd){
    const x = cx + sd*hipX;
    const y = seated ? footY-4 : ankleY+5;
    const w = sh.id==='boot' ? m.leg+12 : m.leg+16;
    const h = sh.id==='boot' ? 26 : 18;
    let s = '';
    if(sh.id==='boot'){
      s += `<path d="M ${R(x-sd*w*.45)} ${R(y-18)} L ${R(x-sd*w*.42)} ${R(y+7)} Q ${R(x)} ${R(y+16)} ${R(x+sd*w*.66)} ${R(y+11)} L ${R(x+sd*w*.62)} ${R(y-3)} Q ${R(x+sd*w*.16)} ${R(y-8)} ${R(x-sd*w*.45)} ${R(y-18)} Z" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>`;
      s += `<path d="M ${R(x-sd*w*.48)} ${R(y+10)} Q ${R(x)} ${R(y+21)} ${R(x+sd*w*.72)} ${R(y+13)}" stroke="${sole}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    } else {
      s += `<path d="M ${R(x-sd*w*.48)} ${R(y)} Q ${R(x-sd*w*.28)} ${R(y-h*.7)} ${R(x+sd*w*.32)} ${R(y-h*.35)} Q ${R(x+sd*w*.68)} ${R(y-h*.12)} ${R(x+sd*w*.7)} ${R(y+6)} Q ${R(x+sd*w*.16)} ${R(y+15)} ${R(x-sd*w*.48)} ${R(y+8)} Z" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>`;
      s += `<path d="M ${R(x-sd*w*.48)} ${R(y+8)} Q ${R(x)} ${R(y+18)} ${R(x+sd*w*.7)} ${R(y+9)}" stroke="${sole}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      if(sh.id==='runner' || sh.id==='sneaker') s += `<path d="M ${R(x-sd*6)} ${R(y-5)} q ${R(sd*9)} 5 ${R(sd*18)} 0" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/>`;
      if(sh.id==='mary') s += `<path d="M ${R(x-sd*w*.28)} ${R(y-5)} Q ${R(x)} ${R(y-14)} ${R(x+sd*w*.36)} ${R(y-4)}" stroke="${sole}" stroke-width="2" fill="none"/>`;
      if(sh.id==='loafer') s += `<path d="M ${R(x-sd*w*.2)} ${R(y-6)} Q ${R(x)} ${R(y-10)} ${R(x+sd*w*.28)} ${R(y-4)}" stroke="${sole}" stroke-width="2" fill="none" opacity="0.55"/>`;
    }
    return s;
  }
  return one(-1)+one(1);
}

function buildCarry(g, state, P){
  const bag = byId(CAT.carry, state.carry);
  if(bag.id==='none') return '';
  const {cx, shoulderY, waistY, hipY} = g; const m=g.bm;
  const c = bag.color || '#29231f';
  const stroke = luminance(c) > .45 ? shade(c,-0.30) : shade(c,0.32);
  let s='';
  if(bag.id==='backpack'){
    s += `<path d="M ${R(cx-m.sh-10)} ${R(shoulderY+18)} q -18 38 0 92 q 14 10 28 0 v-92 Z" fill="${c}" stroke="${stroke}" stroke-width="1.4" opacity="0.9"/>`;
    s += `<path d="M ${R(cx+m.sh+10)} ${R(shoulderY+18)} q 18 38 0 92 q -14 10 -28 0 v-92 Z" fill="${c}" stroke="${stroke}" stroke-width="1.4" opacity="0.9"/>`;
  } else if(bag.id==='crossbody'){
    s += `<path d="M ${R(cx-m.sh-10)} ${R(shoulderY+4)} L ${R(cx+m.hp+32)} ${R(hipY+4)}" stroke="${stroke}" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>`;
    s += `<rect x="${R(cx+m.hp+12)}" y="${R(hipY-14)}" width="42" height="36" rx="10" fill="${c}" stroke="${stroke}" stroke-width="1.6"/>`;
  } else if(bag.id==='tote'){
    const x = cx+m.hp+m.arm+5, y = hipY-18;
    s += `<path d="M ${R(x+8)} ${R(y)} q 11 -22 24 0" stroke="${stroke}" stroke-width="3" fill="none"/>`;
    s += `<path d="M ${R(x)} ${R(y+4)} h44 l-6 62 h-32 Z" fill="${c}" stroke="${stroke}" stroke-width="1.5" opacity="0.94"/>`;
  } else if(bag.id==='beltbag'){
    s += `<path d="M ${R(cx-m.hp-4)} ${R(waistY+10)} Q ${cx} ${R(waistY+22)} ${R(cx+m.hp+4)} ${R(waistY+10)}" stroke="${stroke}" stroke-width="4" fill="none"/>`;
    s += `<rect x="${R(cx-24)}" y="${R(waistY+8)}" width="48" height="24" rx="12" fill="${c}" stroke="${stroke}" stroke-width="1.4"/>`;

    s += `<path d="M ${R(x+8)} ${R(y)} q 10 -15 22 0" stroke="${stroke}" stroke-width="2.2" fill="none"/>`;
    s += `<rect x="${R(x)}" y="${R(y+4)}" width="38" height="30" rx="9" fill="${c}" stroke="${stroke}" stroke-width="1.5"/>`;
  }
  return s;
}

const ALL_PARTS = new Set(['aura','mobilityBack','hairBack','arms','legs','bottom','shoes','torso','top','carry','hands','neck','head','jewelry','features','brows','eyes','nose','lips','makeup','hairFront','glasses','hearing','aac','mobilityFront']);

function avatarMarkup(state, opts){
  opts = opts || {};
  const parts = opts.parts || ALL_PARTS;
  const P = nextP();
  const g = geometry(state);
  const want = (k)=> parts.has(k);
  let body = '';
  body += faceClip(g, P); // clip def (cheap, used by features)
  if(want('aura'))         body += buildAura(g, state, P);
  if(want('mobilityBack')) body += buildMobilityBack(g, state, P);
  if(want('hairBack'))     body += buildHairBack(g, state, P);
  if(want('arms') && !g.seated) body += buildArms(g, state, P);
  if(want('legs'))         body += buildLegs(g, state, P);
  if(want('bottom'))       body += buildBottom(g, state, P);
  if(want('shoes'))        body += buildShoes(g, state, P);
  if(want('torso'))        body += buildBody(g, state, P);
  if(want('arms'))         body += buildArms(g, state, P); // arms over torso edge for sleeves
  if(want('top'))          body += buildTop(g, state, P);
  if(want('carry'))        body += buildCarry(g, state, P);
  if(want('hands') && state.aac==='none') body += buildHands(g, state, P);
  if(want('neck'))         body += buildNeck(g, state, P);
  if(want('head'))         body += buildHead(g, state, P);
  if(want('jewelry'))      body += buildJewelry(g, state, P);
  if(want('features'))     body += buildFeatures(g, state, P);
  if(want('brows'))        body += buildBrows(g, state, P);
  if(want('eyes'))         body += buildEyes(g, state, P);
  if(want('nose'))         body += buildNose(g, state, P);
  if(want('lips'))         body += buildLips(g, state, P);
  if(want('makeup'))       body += buildMakeup(g, state, P);
  if(want('hairFront'))    body += buildHairFront(g, state, P);
  if(want('glasses'))      body += buildGlasses(g, state, P);
  if(want('hearing'))      body += buildHearing(g, state, P);
  if(want('aac'))          body += buildAAC(g, state, P);
  if(want('mobilityFront'))body += buildMobilityFront(g, state, P);
  return defsFor(P, state) + body;
}

function renderAvatar(state, opts){
  opts = opts || {};
  const vb = opts.viewBox || `0 0 ${VIEW.w} ${VIEW.h}`;
  const cls = (opts.class || 'avatar') + (opts.alive ? ' alive' : '');
  const aria = opts.title ? `role="img" aria-label="${opts.title}"` : 'aria-hidden="true"';
  return `<svg class="${cls}" viewBox="${vb}" ${aria} xmlns="http://www.w3.org/2000/svg">${avatarMarkup(state, opts)}</svg>`;
}

const Discover = { active:false, champion:null, challenger:null, step:0, total:0, axis:'', plan:[] };
let discoverReturnFocus = null;   // control to refocus when the overlay closes

function pickDifferent(ids, cur){
  if(ids.length<2) return cur;
  let v = cur, guard = 0;
  while(v===cur && guard++<32){ v = ids[Math.floor(Math.random()*ids.length)]; }
  return v;
}
function discoverVariant(base, axis){
  const s = Object.assign({}, base);
  if(axis==='vibe'){
    let o = CAT.vibe[0];
    for(let i=0;i<16;i++){
      o = CAT.vibe[Math.floor(Math.random()*CAT.vibe.length)];
      if(o.set.top!==base.top || o.set.bottom!==base.bottom || o.set.topColor!==base.topColor) break;
    }
    Object.assign(s, o.set);
  } else if(axis==='hair'){
    s.hair = pickDifferent(LATINO_FIRST_HAIR, base.hair);
  } else if(axis==='hairColor'){
    s.hairColor = pickDifferent(LATINO_FIRST_HAIR_COLORS, base.hairColor);
  } else if(axis==='top'){
    s.top = pickDifferent(CAT.top.map(o=>o.id), base.top);
  } else if(axis==='color'){
    let p = CAT.palette[0];
    for(let i=0;i<16;i++){ p = CAT.palette[Math.floor(Math.random()*CAT.palette.length)]; if(p.top!==base.topColor) break; }
    s.topColor = p.top; s.bottomColor = p.bottom;
  } else if(axis==='shoe'){
    s.shoe = pickDifferent(CAT.shoe.map(o=>o.id), base.shoe);
  }
  return s;
}
function startDiscover(){
  discoverReturnFocus = document.activeElement;   // usually the "Find my vibe" hero
  Discover.active = true;
  Discover.step = 0;
  Discover.plan = ['vibe','vibe','vibe','hair','hairColor','top','color','shoe'];
  Discover.total = Discover.plan.length;
  Discover.champion = Object.assign({}, App.state);   // keep their identity
  Discover.axis = Discover.plan[0];
  Discover.challenger = discoverVariant(Discover.champion, Discover.axis);
  if(appEl) appEl.inert = true;                   // background can't be reached behind the modal
  renderDiscover();
  announce('Find your vibe. Two looks — tap the one you like more.');
}
function renderDiscover(){
  const a = Discover.champion, b = Discover.challenger;
  const dots = Array.from({length:Discover.total}, (_,i)=>
    `<span class="dDot ${i<Discover.step?'done':''} ${i===Discover.step?'now':''}"></span>`).join('');
  discoverEl.innerHTML =
    `<div class="discoverInner" role="dialog" aria-modal="true" aria-label="Find my vibe">
      <button class="dClose" data-action="discover-exit" aria-label="Close find my vibe">\u2715</button>

      <div class="dActions">
        <button class="iconbtn" data-action="discover-skip" aria-label="Show two different looks">\u21bb Show others</button>
        <button class="iconbtn primary" data-action="discover-finish" aria-label="Use this look \u2014 I love it">Love it \u2713</button>

  discoverEl.hidden = false;

}
function chooseDiscover(which){
  if(!Discover.active) return;
  const cards = document.getElementById('dInnerCards');
  if(cards) cards.classList.add('fading');
  setTimeout(() => {
    if(which==='b') Discover.champion = Discover.challenger;
    Discover.step++;
    if(Discover.step >= Discover.total){ finishDiscover(); return; }
    Discover.axis = Discover.plan[Discover.step];
    Discover.challenger = discoverVariant(Discover.champion, Discover.axis);
    renderDiscover();
  }, 200);
}
function skipDiscover(){
  if(!Discover.active) return;
  const cards = document.getElementById('dInnerCards');
  if(cards) cards.classList.add('fading');
  setTimeout(() => {
    Discover.challenger = discoverVariant(Discover.champion, Discover.axis);
    renderDiscover();
    announce('Two more looks.');
  }, 200);
}
function finishDiscover(){
  if(!Discover.active) return;
  const result = Object.assign({}, Discover.champion);
  Discover.active = false;
  closeDiscoverUI();
  App.history.push(Object.assign({}, App.state));
  App.state = result;
  paintAvatar(); renderPanel(); updateToolbar();
  announce('Your vibe is ready \u2014 keep refining or save it.');
}
function exitDiscover(){
  Discover.active = false;
  closeDiscoverUI();
  announce('Closed find my vibe.');
}
function closeDiscoverUI(){
  discoverEl.hidden = true;
  discoverEl.innerHTML = '';
  if(appEl) appEl.inert = false;                  // re-enable the background first
  if(discoverReturnFocus && typeof discoverReturnFocus.focus === 'function'){
    discoverReturnFocus.focus();                  // then send focus back where it came from
  }
  discoverReturnFocus = null;
}

const mount = $('#avatarMount');
const panel = $('#panel');
const catsEl = $('#cats');
const looksEl = $('#looks');
const liveEl = $('#live');
const discoverEl = $('#discover');
const toast = $('#saveToast');
const avatarCard = $('#avatarCard');
const appEl = $('.app');

/* ---- focus retention across re-renders ----
   Panels and the category bar are rebuilt via innerHTML, which destroys the
   control the user just activated and drops focus to <body>. That strands
   keyboard and switch-scanning users on every single choice. We capture the
   active control by its stable data-* attributes before a rebuild and restore
   focus to its replacement afterwards. */
const FOCUS_ATTRS = ['data-action','data-cat','data-key','data-val','data-tab','data-filter','data-idx'];
function rememberFocus(){
  const el = document.activeElement;
  if(!el || el === document.body || typeof el.getAttribute !== 'function') return null;
  const sel = FOCUS_ATTRS.filter(n=>el.hasAttribute(n))
    .map(n=>`[${n}="${(el.getAttribute(n)||'').replace(/"/g,'\\"')}"]`).join('');
  return sel || null;
}
function restoreFocus(sel){
  if(!sel) return;
  const el = document.querySelector(sel);
  if(el && typeof el.focus === 'function') el.focus();
}

/* ---- announce changes for screen readers (polite) ---- */
function announce(msg){ liveEl.textContent = ''; liveEl.textContent = msg; }

/* ---- map App.state → dmFigure opts ---- */
function stateToFigureOpts(s) {
  const bodyMap = { slim:'lean', average:'balanced', athletic:'broad', curvy:'curvy', plus:'full' };
  const heightMap = { h0:'shorter', h1:'short', h2:'medium', h3:'tall', h4:'taller' };
  const shoeMap = { runner:'runner', boot:'boot', loafer:'loafer', mary:'mary', slide:'slide', sneaker:'sneaker' };
  const jewelryMap = { none:'none', studs:'earrings', hoops:'earrings', chain:'chain', pearl:'pearl' };
  const hearingMap = { none:'none', ha_r:'ha', ha_l:'ha', ci_both:'cochlear' };

  const topItem  = byId(CAT.top, s.top);
  const botItem  = byId(CAT.bottom, s.bottom);
  const shoeItem = byId(CAT.shoe, s.shoe);
  const carryItem = s.carry !== 'none' ? byId(CAT.carry, s.carry) : null;

  return {
    skin:        byId(CAT.skin, s.skin).base,
    hair:        s.hair || 'layers',
    hairColor:   byId(CAT.hairColor, s.hairColor).v,
    body:        bodyMap[s.body]   || 'balanced',
    height:      heightMap[s.height] || 'medium',
    expression:  'smile',
    feature:     s.feature !== 'none' ? s.feature : null,
    glasses:     s.glasses !== 'none' ? s.glasses : null,
    hearing:     hearingMap[s.hearing] || 'none',
    top:         topItem,
    topColor:    s.topColor,
    bottom:      botItem,
    bottomColor: s.bottomColor,
    shoes:       shoeMap[s.shoe] || 'sneaker',
    shoeColor:   shoeItem ? shoeItem.color : '#473b30',
    carry:       s.carry !== 'none' ? s.carry : 'none',
    carryColor:  carryItem ? carryItem.color : '#8a5a3f',
    jewelry:     jewelryMap[s.jewelry] || 'none',
    // raw catalog ids consumed by the shared face builders (Engine B) inside dmFigure
    face: {
      skin: s.skin, hairColor: s.hairColor, feature: s.feature,
      brow: s.brow, eye: s.eye, eyeColor: s.eyeColor, nose: s.nose, lip: s.lip,
      piercing: s.piercing, makeup: s.makeup, makeupColor: s.makeupColor, aura: s.aura,
    },
    mobility:    s.mobility,
    aac:         s.aac,
  };
}

/* ---- render the pinned avatar ---- */
function paintAvatar(){
  const opts = stateToFigureOpts(App.state);
  mount.innerHTML = dmFigure(opts);
  const svg = mount.querySelector('svg');
  if (svg) {
    svg.classList.add('avatar');
    // dmFigure sets width="100%" but no height; derive height from viewBox so layout is correct
    const vbParts = (svg.getAttribute('viewBox') || '').split(' ').map(Number);
    if (vbParts.length === 4 && vbParts[2] > 0) {
      // Mobile uses a portrait crop (head-to-knee) to fit the compact sticky card;
      // desktop shows the full figure.
      if (window.innerWidth < 860) {
        svg.setAttribute('viewBox', '0 0 240 340');
        svg.setAttribute('height', 340);
      } else {
        svg.setAttribute('height', vbParts[3]);
      }
      svg.style.removeProperty('overflow');
    }
    svg.setAttribute('aria-label', avatarDescription());
  }
}
function avatarDescription(){
  const s = App.state;
  const parts = [
    byId(CAT.skin,s.skin).label+' skin',
    (s.hair==='bald'?'bald':byId(CAT.hair,s.hair).label+' hair'),
    'wearing a '+byId(CAT.top,s.top).label.toLowerCase(),
  ];
  if(s.makeup!=='none') parts.push(byId(CAT.makeup,s.makeup).label.toLowerCase()+' makeup');
  parts.push(byId(CAT.shoe,s.shoe).label.toLowerCase());
  if(s.carry!=='none') parts.push(byId(CAT.carry,s.carry).label.toLowerCase());
  if(s.glasses!=='none') parts.push('glasses');
  if(s.mobility==='wheelchair') parts.push('using a wheelchair');
  if(s.aac!=='none'){
    const aacName = byId(CAT.aac, s.aac).label;
    parts.push('holding ' + (/^[aeiou]/i.test(aacName) ? 'an ' : 'a ') + aacName.toLowerCase());
  }
  return 'Your avatar: '+parts.join(', ')+'.';
}

/* ---- change state (records history, repaints) ---- */
function setKey(key, val, label){
  App.history.push(Object.assign({}, App.state));
  if(App.history.length > 60) App.history.shift();
  App.state[key] = val;
  paintAvatar();
  renderPanel();
  updateToolbar();
  if(label) announce(label);
}
function setMany(obj, label){
  App.history.push(Object.assign({}, App.state));
  Object.assign(App.state, obj);
  paintAvatar();
  renderPanel();
  updateToolbar();
  if(label) announce(label);
}

/* ---- category bar ---- */
function renderCats(){
  const keepFocus = rememberFocus();
  catsEl.innerHTML = CATS.map(c=>`
    <button class="cat" role="tab" data-action="cat" data-cat="${c.id}"
            aria-pressed="${App.activeCat===c.id}" aria-label="${c.label}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[c.id]||''}</svg>
      <span class="ct">${c.label}</span>
    </button>`).join('');
  restoreFocus(keepFocus);
}

/* ---- swatch builders ---- */
function swatch(action, key, val, selected, label, inner, extra){
  return `<button class="swatch" data-action="${action}" data-key="${key}" data-val="${val}" ${extra||''}
            aria-pressed="${selected}" aria-label="${label}">
            <span class="check" aria-hidden="true">✓</span>
            ${inner}
            <span class="nm">${label}</span>
          </button>`;
}
function miniHead(stateOverride){
  const s = Object.assign({}, App.state, stateOverride);
  return renderAvatar(s, { parts: HEAD_PARTS, viewBox: HEAD_VB, class:'mini' });
}
/* renders a small dmFigure SVG with a crop viewBox — used for vibe cards and body swatches */
function miniDmFigure(stateObj, cropVb, cls) {
  const opts = stateToFigureOpts(stateObj);
  let svg = dmFigure(opts);
  const vb = cropVb || '0 0 240 390';
  svg = svg.replace(/viewBox="[^"]*"/, `viewBox="${vb}"`);
  svg = svg.replace('<svg ', `<svg class="${cls || 'mini'}" `);
  if((cls || '').includes('fitMini')){
    svg = svg.replace('overflow:visible', 'overflow:hidden');
  }
  return svg;
}
function miniBody(stateOverride, crop){
  const s = Object.assign({}, App.state, stateOverride);
  // dmFigure coordinate system (240 wide, ~490 tall):
  // shoulder~114, chest~158, waist~204, hip~246, knee~356, ankle~452, floor~482
  const cropVbs = {
    top:    '30 95 180 190',   // shoulder to hip
    bottom: '30 185 180 210',  // waist to below knee
    shoe:   '30 375 180 115',  // ankle to floor
    carry:  '20 105 200 230',  // shoulder area + bag
  };
  return miniDmFigure(s, cropVbs[crop] || '0 0 240 390');
}

function miniFit(stateOverride, crop){
  const s = Object.assign({}, App.state, stateOverride);
  // Fit tiles should preview the garment/accessory, not a cropped blank face.
  // Use the fashion figure renderer because its proportions read cleaner at card size.
  const topItem = byId(CAT.top, s.top);
  const cropVbs = {
    top:    topItem && topItem.len === 'dress' ? '22 108 196 270' : '22 112 196 205',
    bottom: '18 184 204 306',
    shoe:   '24 368 192 124',
    carry:  '10 122 220 210',
  };
  return miniDmFigure(s, cropVbs[crop] || '0 0 240 390', 'mini fitMini');
}
function fitSwatch(action, key, val, selected, label, inner){
  return `<button class="swatch fitSwatch" data-action="${action}" data-key="${key}" data-val="${val}"
            aria-pressed="${selected}" aria-label="${label}">
            <span class="check" aria-hidden="true">✓</span>
            <span class="fitPreview" aria-hidden="true">${inner}</span>
            <span class="nm">${label}</span>
          </button>`;
}

/* ---- panels ---- */
function renderPanel(){
  const keepFocus = rememberFocus();
  const c = App.activeCat;
  let html = '';
  if(c==='skin')   html = panelSkin();
  else if(c==='face')  html = panelFace();
  else if(c==='hair')  html = panelHair();
  else if(c==='body')  html = panelBody();
  else if(c==='extras')html = panelExtras();
  else if(c==='outfit')html = panelOutfit();
  else if(c==='color') html = panelColor();
  else if(c==='vibe')  html = panelVibe();
  panel.innerHTML = `<div class="panelbar"><h2>${titleFor(c)}</h2><span class="hint">Tap to try it on</span></div>` + html;
  restoreFocus(keepFocus);
}
function titleFor(c){ return ({skin:'Skin & Aura',face:'Face & Expression',hair:'Hair',body:'Shape & height',extras:'Tools & access',outfit:'Fit pieces',color:'Palette',vibe:'Pick a vibe'})[c]; }

function panelSkin(){
  const tones = CAT.skin.map(o=>{
    const sw = `<span class="dot" style="background:linear-gradient(160deg, ${shade(o.base,.12)}, ${o.base} 60%, ${shade(o.base,-.14)});"></span>`;
    return swatch('set','skin',o.id, App.state.skin===o.id, o.label, sw);
  }).join('');
  const feats = CAT.feature.map(o=>{
    const inner = renderAvatar(Object.assign({},App.state,{feature:o.id}), { parts:new Set(['head','features']), viewBox:HEAD_VB, class:'mini'});
    return swatch('set','feature',o.id, App.state.feature===o.id, o.label, inner);
  }).join('');
  const auras = CAT.aura.map(o=> swatch('set','aura',o.id, App.state.aura===o.id, o.label, `<span class="dot" style="background:${o.c||'#fbf8f2'}"></span>`) ).join('');
  return `<div class="group"><h3>Skin tone</h3><div class="grid tones">${tones}</div></div>
          <div class="group"><h3>Skin features</h3><div class="grid">${feats}</div></div>
          <div class="group"><h3>Background Aura</h3><div class="grid colors">${auras}</div></div>`;
}

function panelFace(){
  const tabs = [['eye','Eyes'],['nose','Nose'],['lip','Lips'],['brow','Brows'],['faceShape','Shape'],['makeup','Makeup'],['piercing','Piercings'],['jewelry','Jewelry']];
  const tabBar = tabs.map(([k,l])=>`<button class="subtab" data-action="facetab" data-tab="${k}" aria-pressed="${App.faceTab===k}">${l}</button>`).join('');
  if(App.faceTab==='makeup'){
    const styles = CAT.makeup.map(o=> swatch('set','makeup',o.id, App.state.makeup===o.id, o.label, miniHead({makeup:o.id})) ).join('');
    const colors = CAT.makeupColor.map(o=>{
      const sw = `<span class="dot" style="background:${o.v}"></span>`;
      return swatch('set','makeupColor',o.id, App.state.makeupColor===o.id, o.label, sw);
    }).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Makeup style</h3><div class="grid big">${styles}</div></div>
            <div class="group"><h3>Makeup color</h3><div class="grid colors">${colors}</div></div>`;
  } else if(App.faceTab==='eye'){
    const shapes = CAT.eye.map(o=> swatch('set','eye',o.id, App.state.eye===o.id, o.label, miniHead({eye:o.id})) ).join('');
    const colors = CAT.eyeColor.map(o=> swatch('set','eyeColor',o.id, App.state.eyeColor===o.id, o.label, `<span class="dot" style="background:${o.v}"></span>`) ).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Eye shape</h3><div class="grid big">${shapes}</div></div>
            <div class="group"><h3>Eye color</h3><div class="grid colors">${colors}</div></div>`;
  }
  const arr = CAT[App.faceTab];
  const grid = arr.map(o=>{
    const inner = miniHead({ [App.faceTab]: o.id });
    return swatch('set', App.faceTab, o.id, App.state[App.faceTab]===o.id, o.label, inner);
  }).join('');
  return `<div class="subtabs" role="tablist">${tabBar}</div><div class="grid big">${grid}</div>`;
}

function panelHair(){
  const styles = CAT.hair.map(o=> swatch('set','hair',o.id, App.state.hair===o.id, o.label, miniHead({hair:o.id})) ).join('');
  const colors = CAT.hairColor.map(o=>{
    const sw = `<span class="dot" style="background:linear-gradient(160deg, ${shade(o.v,.16)}, ${o.v} 60%, ${shade(o.v,-.16)});"></span>`;
    return swatch('set','hairColor',o.id, App.state.hairColor===o.id, o.label, sw);
  }).join('');
  return `<div class="group"><h3>Hairstyle</h3><div class="grid big">${styles}</div></div>
          <div class="group"><h3>Hair color</h3><div class="grid colors">${colors}</div></div>`;
}

function panelBody(){

  const heights = CAT.height.map(o=> swatch('set','height',o.id, App.state.height===o.id, o.label, miniBody({height:o.id})) ).join('');
  return `<div class="group"><h3>Silhouette</h3><div class="grid big">${bodies}</div></div>
          <div class="group"><h3>Height</h3><div class="grid big">${heights}</div></div>`;
}

function panelExtras(){
  const glasses = CAT.glasses.map(o=> swatch('set','glasses',o.id, App.state.glasses===o.id, o.label, miniHead({glasses:o.id})) ).join('');
  const mob = CAT.mobility.map(o=> swatch('set','mobility',o.id, App.state.mobility===o.id, o.label, miniBody({mobility:o.id})) ).join('');
  const aac = CAT.aac.map(o=> swatch('set','aac',o.id, App.state.aac===o.id, o.label, miniBody({aac:o.id})) ).join('');

function panelOutfit(){
  const tabs = [['tops','Tops'],['bottoms','Bottoms'],['shoes','Shoes & Carry']];
  const tabBar = tabs.map(([k,l])=>`<button class="subtab" data-action="outfittab" data-tab="${k}" aria-pressed="${App.outfitTab===k}">${l}</button>`).join('');

  if(App.outfitTab==='tops'){
    const tops = CAT.top.map(o=> fitSwatch('set','top',o.id, App.state.top===o.id, o.label, miniFit({top:o.id, bottom:'barrelJean', bottomColor:'#5a6f8c', carry:'none'}, 'top')) ).join('');
    const topsColors = CAT.garmentColor.map(o=> swatch('set','topColor',o.v, App.state.topColor===o.v, o.label, `<span class="dot" style="background:${o.v}"></span>`) ).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Top</h3><div class="grid big fitGrid">${tops}</div></div>
            <div class="group"><h3>Color</h3><div class="grid colors">${topsColors}</div></div>`;
  }
  if(App.outfitTab==='bottoms'){
    const bottoms = CAT.bottom.map(o=> fitSwatch('set','bottom',o.id, App.state.bottom===o.id, o.label, miniFit({top:'ribTank', topColor:'#f1e9d8', bottom:o.id, carry:'none'}, 'bottom')) ).join('');
    const botsColors = CAT.garmentColor.map(o=> swatch('set','bottomColor',o.v, App.state.bottomColor===o.v, o.label, `<span class="dot" style="background:${o.v}"></span>`) ).join('');
    const tex = CAT.texture.map(o=>{
      const inner = `<span class="dot" style="position:relative; overflow:hidden;"><svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" fill="#cdbfb0"/><rect width="40" height="40" fill="url(#${o.pat})"/></svg></span>`;
      return swatch('set','texture',o.id, App.state.texture===o.id, o.label, inner);
    }).join('');
    return `<div class="subtabs" role="tablist">${tabBar}</div>
            <div class="group"><h3>Bottoms</h3><div class="grid big fitGrid">${bottoms}</div></div>
            <div class="group"><h3>Color</h3><div class="grid colors">${botsColors}</div></div>
            <div class="group"><h3>Feel / texture</h3><div class="grid">${tex}</div></div>`;
  }
  // shoes & carry tab
  const shoes = CAT.shoe.map(o=> fitSwatch('set','shoe',o.id, App.state.shoe===o.id, o.label, miniFit({top:'boxyTee', bottom:'leggings', bottomColor:'#3c3a38', shoe:o.id, carry:'none'}, 'shoe')) ).join('');
  const carry = CAT.carry.map(o=> fitSwatch('set','carry',o.id, App.state.carry===o.id, o.label, miniFit({top:'boxyTee', topColor:'#f1e9d8', bottom:'barrelJean', bottomColor:'#5a6f8c', carry:o.id}, 'carry')) ).join('');
  return `<div class="subtabs" role="tablist">${tabBar}</div>
          <div class="group"><h3>Shoes</h3><div class="grid big fitGrid">${shoes}</div></div>
          <div class="group"><h3>Carry</h3><div class="grid big fitGrid">${carry}</div></div>`;
}

function panelColor(){
  const pals = CAT.palette.map(o=>{
    const inner = `<span style="display:flex;gap:4px"><span class="dot" style="width:22px;height:38px;border-radius:8px;background:${o.top}"></span><span class="dot" style="width:22px;height:38px;border-radius:8px;background:${o.bottom}"></span></span>`;
    const sel = App.state.topColor===o.top && App.state.bottomColor===o.bottom;
    return swatch('palette','palette',o.id, sel, o.label, inner);
  }).join('');
  return `<div class="group"><h3>Coordinated palettes</h3><div class="grid big">${pals}</div></div>`;
