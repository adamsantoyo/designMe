<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>designMe — Find Your Vibe</title>
<style>
  /* ============================================================
     DESIGN TOKENS — warm, natural, low-arousal palette
     ============================================================ */
  :root {
    --bg:        #f1ebe0;   /* warm neutral page */
    --bg-2:      #e9e1d3;   /* slightly deeper neutral */
    --panel:     #fbf8f2;   /* card / panel */
    --panel-2:   #f4eee4;   /* inset */
    --ink:       #2f2823;   /* primary text (AA on panel) */
    --ink-soft:  #6b5f53;   /* secondary text */
    --line:      #ddd0bd;   /* hairline borders */
    --line-2:    #cabfa9;
    --wood:      #a9764f;   /* warm wood accent */
    --stone:     #cdbfb0;
    --sage:      #6f8f6a;   /* primary accent */
    --sage-deep: #3f5c3b;   /* accent text / focus (AA) */
    --terra:     #bd7a4f;   /* save / warm action */
    --terra-deep:#8a5430;
    --sky:       #6f8a9b;
    --selected:  #355c39;   /* selected ring */
    --focus:     #1f4d2c;   /* focus ring (high contrast) */
    --radius:    18px;
    --radius-sm: 12px;
    --shadow:    0 2px 10px rgba(60,45,30,.08), 0 1px 3px rgba(60,45,30,.06);
    --tap:       48px;      /* min touch target */
    --tap-lg:    66px;      /* primary choices */
    --ease:      cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Screen-reader-only helper */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* ----- Focus visibility (keyboard) ----- */
  :focus { outline: none; }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .app {
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-right: auto;
  }
  .brand b {
    font-size: 1.18rem;
    letter-spacing: .2px;
    color: var(--ink);
  }
  .brand span { color: var(--ink-soft); font-size: .82rem; }

  .iconbtn {
    min-width: var(--tap); min-height: var(--tap);
    padding: 8px 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1.5px solid var(--line-2);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    font: inherit; font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s var(--ease), background .12s var(--ease), border-color .12s var(--ease);
  }
  .iconbtn svg { display: block; }
  .iconbtn:hover { background: var(--panel-2); }
  .iconbtn:active { transform: translateY(1px) scale(.99); }
  .iconbtn.primary { background: var(--terra); border-color: var(--terra); color: #fff; }
  .iconbtn.primary:hover { background: var(--terra-deep); }
  .iconbtn.ghost { background: transparent; box-shadow: none; }
  .iconbtn[disabled] { opacity: .4; cursor: default; box-shadow: none; }
  .iconbtn .lbl { font-size: .92rem; }

  .stage {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 0 14px 18px;
    flex: 1;
  }

  /* Avatar pane — pinned & always visible */
  .avatarPane {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 70%, rgba(241,235,224,0) 100%);
    padding-top: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatarCard {
    width: 100%;
    max-width: 340px;
    background:
      radial-gradient(120% 80% at 50% 12%, #fcf9f4 0%, var(--panel) 55%, var(--panel-2) 100%);
    border: 1.5px solid var(--line);
    border-radius: 26px;
    box-shadow: var(--shadow);
    padding: 8px 8px 4px;
    position: relative;
  }
  .avatarCard svg.avatar { width: 100%; height: auto; display: block; }

  .saveToast {
    position: absolute;
    left: 50%; bottom: 12px;
    transform: translateX(-50%) translateY(8px);
    background: var(--sage-deep);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700; font-size: .9rem;
    opacity: 0;
    pointer-events: none;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(40,60,40,.28);
    transition: opacity .28s var(--ease), transform .34s var(--ease);
  }
  .saveToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* gentle confirmation pulse on the avatar */
  @keyframes savedPulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  .avatarCard.saved svg.avatar { animation: savedPulse .5s var(--ease); }

  /* Controls pane */
  .controls { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  /* Category bar */
  .cats {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(64px, 1fr);
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .cat {
    min-height: var(--tap-lg);
    border: 1.5px solid var(--line-2);
    background: var(--panel);
    border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; font: inherit; color: var(--ink-soft);
    padding: 8px 6px;
    transition: transform .12s var(--ease), border-color .12s var(--ease), background .12s var(--ease), color .12s var(--ease);
  }
  .cat svg { width: 26px; height: 26px; }
  .cat .ct { font-size: .76rem; font-weight: 700; }
  .cat:hover { background: var(--panel-2); }
  .cat[aria-pressed="true"] {
    border-color: var(--sage);
    background: #eef3ea;
    color: var(--sage-deep);
    box-shadow: 0 0 0 2px rgba(111,143,106,.25);
  }
  .cat:active { transform: translateY(1px); }

  /* Panel toolbar (Back / Undo + title) */
  .panelbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 2px;
  }
  .panelbar h2 {
    margin: 0; font-size: 1.02rem; font-weight: 800; color: var(--ink);
    margin-right: auto; letter-spacing: .2px;
  }
  .panelbar .hint { color: var(--ink-soft); font-size: .8rem; font-weight: 600; margin-right: auto; }

  /* Panel */
  .panel {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    min-height: 220px;
  }
  .group + .group { margin-top: 14px; }
  .group > h3 {
    margin: 0 0 8px; font-size: .82rem; font-weight: 800;
    color: var(--ink-soft); text-transform: none; letter-spacing: .2px;
  }

  /* subtabs (Face) */
  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .subtab {
    min-height: var(--tap); padding: 6px 14px;
    border: 1.5px solid var(--line-2); background: var(--panel-2);
    border-radius: 999px; cursor: pointer; font: inherit; font-weight: 700;
    color: var(--ink-soft);
  }
  .subtab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* swatch grids */
  .grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
  }
  .grid.big { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .grid.tones { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
  .grid.colors { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }

  .swatch {
    position: relative;
    border: 2px solid var(--line-2);
    background: var(--panel-2);
    border-radius: 16px;
    padding: 6px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-height: var(--tap-lg);
    transition: transform .1s var(--ease), border-color .12s var(--ease), box-shadow .12s var(--ease);
    color: var(--ink);
    font: inherit;
  }
  .swatch svg, .swatch .dot { display: block; pointer-events: none; }
  .swatch .nm { font-size: .72rem; font-weight: 700; color: var(--ink-soft); text-align: center; line-height: 1.1; }
  .swatch:hover { border-color: var(--stone); }
  .swatch:active { transform: scale(.97); }
  .swatch[aria-pressed="true"] {
    border-color: var(--selected);
    box-shadow: 0 0 0 3px rgba(53,92,57,.22);
    background: #eef3ea;
  }
  .swatch[aria-pressed="true"] .nm { color: var(--sage-deep); }
  .swatch .check {
    position: absolute; top: -8px; right: -8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--selected); color: #fff;
    display: none; align-items: center; justify-content: center;
    font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .swatch[aria-pressed="true"] .check { display: flex; }

  .dot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
  .tones .dot { width: 38px; height: 38px; }
  .colors .swatch { min-height: 52px; padding: 5px; }

  /* Lookbook */
  .lookbook {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .lookbook h3 {
    margin: 0 0 8px; font-size: .82rem; font-weight: 800; color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px;
  }
  .looks { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .look {
    flex: 0 0 auto;
    width: 76px; height: 96px;
    border: 1.5px solid var(--line-2); background: var(--panel-2);
    border-radius: 14px; cursor: pointer; padding: 2px;
    transition: transform .1s var(--ease), border-color .12s var(--ease);
  }
  .look:hover { border-color: var(--sage); }
  .look:active { transform: scale(.97); }
  .look svg { width: 100%; height: 100%; display: block; }
  .looks .empty {
    color: var(--ink-soft); font-size: .82rem; font-weight: 600;
    display: flex; align-items: center; padding: 8px 4px;
  }

  /* Inspire stub */
  .inspire {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px dashed var(--line-2);
    background: repeating-linear-gradient(135deg, var(--panel) 0 10px, var(--panel-2) 10px 20px);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--ink-soft);
  }
  .inspire .ttl { font-weight: 800; color: var(--ink); }
  .inspire .sub { font-size: .8rem; }
  .inspire button { margin-left: auto; }
  .badge {
    font-size: .66rem; font-weight: 800; letter-spacing: .4px;
    background: var(--bg-2); color: var(--ink-soft);
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2);
    text-transform: uppercase;
  }

  /* ----- Desktop: avatar beside controls ----- */
  @media (min-width: 860px) {
    .stage {
      grid-template-columns: 360px 1fr;
      align-items: start;
    }
    .avatarPane {
      position: sticky; top: 14px;
      background: none; padding-top: 0;
    }
    .avatarCard { max-width: 360px; }
  }

  /* ----- Reduced motion ----- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
    .avatarCard.saved svg.avatar { animation: none; }
    .saveToast { transition: opacity .12s linear; }
  }

  /* ============================================================
     2026 FASHION-STUDIO REWORK
     The first draft proved the mechanics; this layer makes it feel like
     a modern style tool: larger avatar, premium materiality, stronger
     visual hierarchy, richer choice tiles, and less generic beige UI.
     ============================================================ */
  :root {
    --bg: #ece7dc;
    --bg-2: #dcd4c5;
    --panel: rgba(255, 252, 246, .88);
    --panel-2: rgba(242, 236, 225, .94);
    --ink: #29231f;
    --ink-soft: #675c51;
    --line: rgba(94, 78, 61, .18);
    --line-2: rgba(94, 78, 61, .27);
    --sage: #6e8c72;
    --sage-deep: #334f38;
    --terra: #a85f43;
    --terra-deep: #7a3f2c;
    --selected: #1f4f35;
    --shadow: 0 20px 60px rgba(57, 43, 28, .12), 0 2px 10px rgba(57, 43, 28, .08);
    --shadow-soft: 0 10px 28px rgba(57, 43, 28, .10);
  }

  body {
    background:
      linear-gradient(135deg, rgba(83, 103, 84, .16), rgba(190, 117, 82, .12) 34%, rgba(111, 138, 155, .12) 72%, rgba(236, 231, 220, 1)),
      var(--bg);
  }
  .app { max-width: 1280px; }
  .topbar {
    padding: 18px clamp(16px, 3vw, 30px) 10px;
    gap: 12px;
  }
  .brand { flex-direction: column; align-items: flex-start; gap: 1px; }
  .brand b { font-size: clamp(1.3rem, 2.2vw, 1.85rem); font-weight: 900; }
  .brand span {
    font-size: .78rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .stage {
    grid-template-columns: 1fr;
    gap: 18px;
    padding: 0 clamp(14px, 3vw, 30px) 28px;
  }
  .avatarPane { background: transparent; top: 0; }
  .avatarCard {
    max-width: min(92vw, 430px);
    padding: 14px 14px 6px;
    border-radius: 32px;
    border-color: rgba(255,255,255,.55);
    background:
      radial-gradient(42% 36% at 50% 18%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.34) 58%, rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,252,246,.92), rgba(231, 224, 213, .88)),
      linear-gradient(135deg, rgba(111,143,106,.22), rgba(189,122,79,.14));
    box-shadow: 0 32px 80px rgba(57,43,28,.16), inset 0 1px 0 rgba(255,255,255,.8);
    overflow: hidden;
  }
  .avatarCard::before {
    content:"";
    position:absolute;
    inset: 10px 10px auto;
    height: 58%;
    border-radius: 26px 26px 999px 999px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.45), rgba(255,255,255,0) 36%, rgba(255,255,255,.35)),
      linear-gradient(180deg, rgba(255,255,255,.4), rgba(125,105,81,.08));
    pointer-events: none;
  }
  .avatarCard::after {
    content:"";
    position:absolute;
    left: 18%; right: 18%; bottom: 28px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(47,40,35,.16), rgba(47,40,35,0));
    pointer-events:none;
  }
  .avatarCard svg.avatar { position: relative; z-index: 1; }
  .saveToast { z-index: 4; }

  .controls { gap: 14px; }
  .cats {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 8px;
    gap: 8px;
    background: rgba(236,231,220,.76);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 24px;
    box-shadow: var(--shadow-soft);
  }
  .cat {
    min-height: 72px;
    border-radius: 20px;
    border: 1px solid rgba(94,78,61,.16);
    background: rgba(255,252,246,.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
  }
  .cat svg { width: 28px; height: 28px; }
  .cat .ct { font-size: .78rem; }
  .cat[aria-pressed="true"] {
    background: linear-gradient(180deg, #f4f8ef, #e5efdf);
    box-shadow: 0 10px 22px rgba(63,92,59,.18), inset 0 1px 0 rgba(255,255,255,.8);
  }

  .panelbar { padding: 2px 4px; }
  .panelbar h2 { font-size: clamp(1.08rem, 1.6vw, 1.35rem); }
  .panelbar .hint { font-size: .78rem; letter-spacing: .02em; }
  .panel {
    padding: clamp(12px, 2vw, 18px);
    border-radius: 28px;
    background: rgba(255,252,246,.78);
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    border-color: rgba(255,255,255,.56);
  }
  .group + .group { margin-top: 20px; }
  .group > h3 {
    font-size: .78rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .grid { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); }
  .grid.big { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .grid.tones { grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); }
  .grid.colors { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
  .swatch {
    min-height: 94px;
    padding: 8px;
    border-radius: 22px;
    border: 1.5px solid rgba(94,78,61,.18);
    background:
      linear-gradient(180deg, rgba(255,255,255,.7), rgba(242,236,225,.78)),
      var(--panel-2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.76), 0 5px 14px rgba(57,43,28,.08);
  }
  .swatch svg.mini { width: 100%; height: 82px; object-fit: contain; }
  .swatch .nm { font-size: .75rem; color: var(--ink); font-weight: 850; }
  .swatch:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.76), 0 10px 22px rgba(57,43,28,.12); }
  .swatch[aria-pressed="true"] {
    background: linear-gradient(180deg, #f5f8ef, #e6efdf);
    border-color: var(--selected);
    box-shadow: 0 0 0 3px rgba(31,79,53,.18), 0 12px 28px rgba(31,79,53,.12);
  }
  .tones .swatch, .colors .swatch { min-height: 68px; }
  .dot { width: 44px; height: 44px; }

  .subtabs {
    padding: 6px;
    background: rgba(230,224,213,.55);
    border-radius: 999px;
    border: 1px solid rgba(94,78,61,.14);
  }
  .subtab {
    border: 0;
    background: transparent;
    min-height: 44px;
    color: var(--ink-soft);
  }
  .subtab[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
    box-shadow: 0 8px 18px rgba(41,35,31,.18);
  }

  .lookbook, .inspire {
    border-radius: 24px;
    background: rgba(255,252,246,.72);
    backdrop-filter: blur(18px);
    border-color: rgba(255,255,255,.56);
    box-shadow: var(--shadow-soft);
  }
  .look { width: 86px; height: 112px; border-radius: 18px; }
  .iconbtn {
    border: 1px solid rgba(94,78,61,.18);
    box-shadow: 0 8px 18px rgba(57,43,28,.09), inset 0 1px 0 rgba(255,255,255,.65);
    font-weight: 800;
  }
  .iconbtn.primary {
    background: linear-gradient(180deg, #b86c4d, #934a32);
    border-color: rgba(126,63,42,.5);
  }

  .vibeGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .vibeFilters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    scrollbar-width: thin;
  }
  .vibeFilter {
    min-height: 44px;
    border: 1px solid rgba(94,78,61,.18);
    background: rgba(255,252,246,.72);
    border-radius: 999px;
    padding: 8px 14px;
    white-space: nowrap;
    cursor: pointer;
    color: var(--ink-soft);
    font: inherit;
    font-weight: 850;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
  }
  .vibeFilter[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    box-shadow: 0 10px 22px rgba(41,35,31,.18);
  }
  .vibeCard {
    min-height: 286px;
    border: 1.5px solid rgba(94,78,61,.18);
    border-radius: 28px;
    background:
      radial-gradient(78% 72% at 50% 12%, var(--vibeTop, rgba(255,255,255,.64)), rgba(255,255,255,0) 64%),
      linear-gradient(145deg, rgba(255,255,255,.74), var(--vibeBottom, rgba(242,236,225,.74))),
      var(--panel-2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 12px 30px rgba(57,43,28,.10);
    padding: 10px;
    cursor: pointer;
    color: var(--ink);
    font: inherit;
    text-align: left;
    display: grid;
    grid-template-rows: minmax(184px, 1fr) auto;
    gap: 8px;
    overflow: hidden;
  }
  .vibeCard:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(57,43,28,.14); }
  .vibeCard[aria-pressed="true"] {
    border-color: var(--selected);
    box-shadow: 0 0 0 3px rgba(31,79,53,.18), 0 16px 38px rgba(57,43,28,.14);
  }
  .vibeCard svg.mini { width: 100%; height: 194px; display: block; }
  .vibePreview {
    border-radius: 22px;
    background:
      radial-gradient(80% 64% at 50% 14%, rgba(255,255,255,.82), rgba(255,255,255,0)),
